<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAG — Заказдар</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#06251B;
  color:#F4EBD0;
  min-height:100vh;
}

header{
  background:#041b13;
  border-bottom:1px solid #D4AF37;
  padding:16px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  color:#D4AF37;
  font-size:27px;
  font-weight:800;
  text-decoration:none;
}

nav{
  display:flex;
  gap:18px;
}

nav a{
  color:#F4EBD0;
  text-decoration:none;
  font-size:14px;
}

nav a:hover{
  color:#D4AF37;
}

.container{
  max-width:1050px;
  margin:40px auto;
  padding:0 20px;
}

h1{
  color:#D4AF37;
  margin-bottom:25px;
}

.order{
  background:#0a3023;
  border:1px solid rgba(212,175,55,.35);
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

.order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #234d3c;
  padding-bottom:15px;
}

.order-id{
  color:#D4AF37;
  font-size:19px;
  font-weight:bold;
}

.status{
  background:#123f30;
  color:#D4AF37;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
}

.item{
  background:#06251B;
  border-radius:12px;
  padding:18px;
  margin-top:15px;
  border:1px solid rgba(212,175,55,.2);
}

.service{
  font-size:19px;
  font-weight:bold;
  color:#D4AF37;
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.info div{
  background:#0a3023;
  padding:11px;
  border-radius:8px;
  line-height:1.4;
}

.master{
  margin-top:15px;
  padding:12px;
  background:#123f30;
  border-radius:10px;
}

.total{
  text-align:right;
  font-size:22px;
  font-weight:bold;
  color:#D4AF37;
  margin-top:20px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button,
.btn{
  display:inline-block;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#D4AF37;
  color:#06251B;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  margin-top:15px;
}

.secondary{
  background:#123f30;
  color:#F4EBD0;
  border:1px solid #476b5b;
}

.danger{
  background:#8b2f2f;
  color:white;
}

.empty{
  background:#0a3023;
  border:1px solid rgba(212,175,55,.3);
  border-radius:18px;
  padding:50px 20px;
  text-align:center;
  color:#aaa;
}

.filter{
  display:flex;
  gap:10px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.filter button{
  margin:0;
}

.active{
  background:#D4AF37!important;
  color:#06251B!important;
}

@media(max-width:700px){

  nav a:nth-child(1),
  nav a:nth-child(2){
    display:none;
  }

  .info{
    grid-template-columns:1fr;
  }

  .order-header{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">KAG</a>

  <nav>
    <a href="marketplace.html">Кызматтар</a>
    <a href="cart.html">🛒 Корзина</a>
    <a href="orders.html">📦 Заказдар</a>
    <a href="profile.html">👤 Профиль</a>
  </nav>

</header>


<div class="container">

  <h1>📦 Заказдар</h1>


  <div class="filter">

    <button
      id="allBtn"
      class="active"
      onclick="setFilter('all')"
    >
      Баары
    </button>

    <button
      id="newBtn"
      class="secondary"
      onclick="setFilter('Жаңы заказ')"
    >
      Жаңы
    </button>

    <button
      id="workBtn"
      class="secondary"
      onclick="setFilter('Аткарылууда')"
    >
      Аткарылууда
    </button>

    <button
      id="doneBtn"
      class="secondary"
      onclick="setFilter('Аткарылды')"
    >
      Бүттү
    </button>

  </div>


  <div id="orders"></div>

</div>


<script>

let orders =
  JSON.parse(
    localStorage.getItem("kagOrders") || "[]"
  );

let user =
  JSON.parse(
    localStorage.getItem("kagUser") || "null"
  );

let currentFilter = "all";


/* =========================
   RENDER
========================= */

renderOrders();


function renderOrders(){

  const container =
    document.getElementById("orders");


  let filtered = orders;


  if(currentFilter !== "all"){

    filtered =
      orders.filter(
        order =>
          (order.status || "Жаңы заказ")
          === currentFilter
      );

  }


  if(!filtered.length){

    container.innerHTML = `

      <div class="empty">

        <h2 style="color:#D4AF37;">
          Заказ жок
        </h2>

        <p style="margin-top:10px;">
          Бул бөлүмдө азырынча заказ жок.
        </p>

        <a
          href="marketplace.html"
          class="btn"
        >
          🔎 Кызмат издөө
        </a>

      </div>

    `;

    return;
  }


  container.innerHTML =
    filtered
      .slice()
      .reverse()
      .map(
        (order,index) =>
          orderHtml(order,index)
      )
      .join("");

}


/* =========================
   ORDER HTML
========================= */

function orderHtml(order,index){

  const created =
    order.createdAt
      ? new Date(
          order.createdAt
        ).toLocaleString("ky-KG")
      : "—";


  const items =
    Array.isArray(order.items)
      ? order.items
      : [];


  return `

    <div class="order">

      <div class="order-header">

        <div>

          <div class="order-id">
            ${escapeHtml(
              order.id || "KAG-ORDER"
            )}
          </div>

          <div style="
            margin-top:6px;
            color:#aaa;
            font-size:13px;
          ">
            ${created}
          </div>

        </div>

        <div class="status">
          ${escapeHtml(
            order.status ||
            "Жаңы заказ"
          )}
        </div>

      </div>


      ${
        items.length
        ? items.map(item => `

          <div class="item">

            <div class="service">
              ${escapeHtml(
                item.service ||
                "Кызмат"
              )}
            </div>

            <div class="info">

              <div>
                📂 <strong>Категория:</strong><br>
                ${escapeHtml(
                  item.category || "—"
                )}
              </div>

              <div>
                💰 <strong>Баасы:</strong><br>
                ${Number(
                  item.price || 0
                ).toLocaleString()} сом
              </div>

              <div>
                📍 <strong>Дарек:</strong><br>
                ${escapeHtml(
                  item.address || "—"
                )}
              </div>

              <div>
                📅 <strong>Дата:</strong><br>
                ${escapeHtml(
                  item.date || "—"
                )}
              </div>

            </div>


            ${
              item.master
              ? `
                <div class="master">

                  👨‍🔧
                  <strong>Мастер:</strong>
                  ${escapeHtml(
                    item.master
                  )}

                  ${
                    item.masterRating
                    ? `
                      <span style="
                        color:#D4AF37;
                        margin-left:8px;
                      ">
                        ⭐ ${item.masterRating}
                      </span>
                    `
                    : ""
                  }

                </div>
              `
              : ""
            }


            ${
              item.note
              ? `
                <p style="
                  margin-top:14px;
                  color:#ccc;
                  line-height:1.5;
                ">
                  📝
                  ${escapeHtml(
                    item.note
                  )}
                </p>
              `
              : ""
            }

          </div>

        `).join("")
        : `
          <div class="item">
            Заказда кызматтар жок.
          </div>
        `
      }


      <div class="total">

        Жалпы:
        ${Number(
          order.total || 0
        ).toLocaleString()}
        сом

      </div>


      <div style="
        margin-top:8px;
        color:#aaa;
      ">

        👤 Кардар:
        ${escapeHtml(
          order.customerName || "—"
        )}

        ${
          order.customerPhone
          ? `
            <br>
            📞 ${escapeHtml(
              order.customerPhone
            )}
          `
          : ""
        }

        ${
          order.paymentMethod
          ? `
            <br>
            💳 Төлөм:
            ${escapeHtml(
              order.paymentMethod
            )}
          `
          : ""
        }

      </div>


      <div class="actions">

        <button
          onclick="changeStatus(${getOriginalIndex(order)})"
        >
          🔄 Статус өзгөртүү
        </button>

        <button
          class="secondary"
          onclick="repeatOrder(${getOriginalIndex(order)})"
        >
          🔁 Кайра заказ
        </button>

        <button
          class="danger"
          onclick="deleteOrder(${getOriginalIndex(order)})"
        >
          🗑 Өчүрүү
        </button>

      </div>

    </div>

  `;

}


/* =========================
   ORIGINAL INDEX
========================= */

function getOriginalIndex(order){

  return orders.findIndex(
    o => o.id === order.id
  );

}


/* =========================
   CHANGE STATUS
========================= */

function changeStatus(index){

  if(index < 0){
    return;
  }


  const statuses = [

    "Жаңы заказ",
    "Аткарылууда",
    "Аткарылды"

  ];


  const current =
    orders[index].status ||
    "Жаңы заказ";


  const currentIndex =
    statuses.indexOf(current);


  const nextIndex =
    currentIndex >= 0
      ? (currentIndex + 1) % statuses.length
      : 0;


  orders[index].status =
    statuses[nextIndex];


  localStorage.setItem(
    "kagOrders",
    JSON.stringify(orders)
  );


  renderOrders();

}


/* =========================
   REPEAT ORDER
========================= */

function repeatOrder(index){

  if(index < 0){
    return;
  }


  const order =
    orders[index];


  if(!Array.isArray(order.items)){

    alert(
      "Бул заказда кызмат жок."
    );

    return;
  }


  localStorage.setItem(
    "kagCart",
    JSON.stringify(
      order.items
    )
  );


  window.location.href =
    "checkout.html";

}


/* =========================
   DELETE ORDER
========================= */

function deleteOrder(index){

  if(index < 0){
    return;
  }


  if(
    !confirm(
      "Бул заказды өчүрөсүзбү?"
    )
  ){

    return;

  }


  orders.splice(
    index,
    1
  );


  localStorage.setItem(
    "kagOrders",
    JSON.stringify(orders)
  );


  renderOrders();

}


/* =========================
   FILTER
========================= */

function setFilter(filter){

  currentFilter = filter;


  document.querySelectorAll(
    ".filter button"
  ).forEach(btn => {

    btn.classList.remove(
      "active"
    );

    btn.classList.add(
      "secondary"
    );

  });


  const map = {

    all:"allBtn",

    "Жаңы заказ":"newBtn",

    "Аткарылууда":"workBtn",

    "Аткарылды":"doneBtn"

  };


  const active =
    document.getElementById(
      map[filter]
    );


  if(active){

    active.classList.add(
      "active"
    );

    active.classList.remove(
      "secondary"
    );

  }


  renderOrders();

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
