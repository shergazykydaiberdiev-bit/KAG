<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAG — Менин заказдарым</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    background:#06251B;
    color:#F4EBD0;
    margin:0;
    font-family:Arial,sans-serif;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 25px;
    background:#041C15;
    border-bottom:1px solid #D4AF37;
}

.logo{
    color:#D4AF37;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

.nav a{
    color:#F4EBD0;
    text-decoration:none;
    margin-left:18px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.title{
    color:#D4AF37;
    font-size:32px;
    margin-bottom:25px;
}

.order{
    background:#041C15;
    border:1px solid #174C3B;
    border-radius:16px;
    padding:22px;
    margin-bottom:18px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #174C3B;
    padding-bottom:15px;
}

.order-id{
    color:#D4AF37;
    font-weight:bold;
    font-size:18px;
}

.date{
    color:#8fa69e;
    font-size:13px;
}

.status{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    background:#174C3B;
    color:#D4AF37;
    font-size:13px;
    margin-top:12px;
}

.item{
    padding:15px 0;
    border-bottom:1px solid #12382d;
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:18px;
    font-weight:bold;
}

.info{
    color:#9fb5ad;
    font-size:14px;
    margin-top:7px;
}

.total{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #28634f;
    font-size:20px;
    font-weight:bold;
}

.total-price{
    color:#D4AF37;
}

.empty{
    text-align:center;
    padding:70px 20px;
    background:#041C15;
    border:1px solid #174C3B;
    border-radius:16px;
}

.empty-icon{
    font-size:60px;
}

.empty a{
    display:inline-block;
    margin-top:20px;
    padding:13px 22px;
    background:#D4AF37;
    color:#06251B;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:11px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:#D4AF37;
    color:#06251B;
}

.btn-secondary{
    background:#174C3B;
    color:#F4EBD0;
}

.btn-danger{
    background:#512525;
    color:#ffb0b0;
}

@media(max-width:700px){

    .nav{
        display:none;
    }

    .title{
        font-size:27px;
    }

    .order-top{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        KΛG
    </a>

    <nav class="nav">
        <a href="index.html">Башкы бет</a>
        <a href="marketplace.html">Кызматтар</a>
        <a href="cart.html">🛒 Корзина</a>
        <a href="orders.html">📦 Заказдар</a>
        <a href="profile.html">Профиль</a>
    </nav>

</header>


<main class="container">

    <h1 class="title">
        📦 Менин заказдарым
    </h1>

    <div id="ordersContainer"></div>

</main>


<script>

let orders = JSON.parse(
    localStorage.getItem("kagOrders") || "[]"
);


function formatPrice(price){

    return Number(price || 0)
        .toLocaleString("ru-RU") + " сом";

}


function formatDate(date){

    if(!date) return "";

    const d = new Date(date);

    return d.toLocaleString("ru-RU",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });

}


function renderOrders(){

    const container =
        document.getElementById("ordersContainer");


    if(orders.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <h2>
                    Азырынча заказ жок
                </h2>

                <p>
                    Кызмат тандап, биринчи заказыңызды бериңиз.
                </p>

                <a href="marketplace.html">
                    Кызматтарды көрүү
                </a>

            </div>

        `;

        return;
    }


    container.innerHTML = orders.map(
        (order,index) => {

        const items =
            order.items || [];


        return `

            <div class="order">

                <div class="order-top">

                    <div>

                        <div class="order-id">
                            ${order.id}
                        </div>

                        <div class="date">
                            ${formatDate(order.createdAt)}
                        </div>

                    </div>

                    <div class="status">
                        ${order.status || "Жаңы заказ"}
                    </div>

                </div>


                ${
                    items.map(item => `

                        <div class="item">

                            <div class="item-name">
                                ${item.service || "KAG кызматы"}
                            </div>

                            <div class="info">
                                Категория:
                                ${item.category || "Кызмат"}
                            </div>

                            ${
                                item.address
                                ? `
                                <div class="info">
                                    📍 ${item.address}
                                </div>
                                `
                                : ""
                            }

                            ${
                                item.date
                                ? `
                                <div class="info">
                                    📅 ${item.date}
                                </div>
                                `
                                : ""
                            }

                            ${
                                item.note
                                ? `
                                <div class="info">
                                    📝 ${item.note}
                                </div>
                                `
                                : ""
                            }

                            <div class="info">
                                💰 ${formatPrice(item.price)}
                            </div>

                        </div>

                    `).join("")
                }


                <div class="info">

                    👤 ${order.customerName || "Кардар"}

                    <br>

                    📞 ${order.customerPhone || ""}

                    <br>

                    💳 ${
                        paymentName(
                            order.paymentMethod
                        )
                    }

                </div>


                <div class="total">

                    <span>
                        Жалпы:
                    </span>

                    <span class="total-price">
                        ${formatPrice(order.total)}
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="btn btn-primary"
                        onclick="viewOrder(${index})"
                    >
                        👁 Толук маалымат
                    </button>

                    <button
                        class="btn btn-secondary"
                        onclick="repeatOrder(${index})"
                    >
                        🔄 Кайра заказ
                    </button>

                    <button
                        class="btn btn-danger"
                        onclick="deleteOrder(${index})"
                    >
                        🗑 Өчүрүү
                    </button>

                </div>

            </div>

        `;

    }).join("");

}


function paymentName(method){

    const names = {

        cash:"Накталай",

        card:"Банк картасы",

        mbank:"MBank",

        odengi:"O!Dengi"

    };

    return names[method] || "Төлөм";

}


function viewOrder(index){

    const order = orders[index];

    let text =
        "Заказ: " + order.id + "\n\n";

    text +=
        "Статус: " +
        (order.status || "Жаңы заказ") +
        "\n\n";

    text +=
        "Кардар: " +
        (order.customerName || "") +
        "\n";

    text +=
        "Телефон: " +
        (order.customerPhone || "") +
        "\n\n";


    (order.items || []).forEach(item => {

        text +=
            "Кызмат: " +
            (item.service || "") +
            "\n";

        text +=
            "Баасы: " +
            formatPrice(item.price) +
            "\n";

        if(item.address){

            text +=
                "Дарек: " +
                item.address +
                "\n";

        }

        if(item.date){

            text +=
                "Дата: " +
                item.date +
                "\n";

        }

        text += "\n";

    });


    text +=
        "Жалпы: " +
        formatPrice(order.total);


    alert(text);

}


function repeatOrder(index){

    const order = orders[index];

    if(!order.items || order.items.length === 0){

        alert("Кайра заказ кылууга кызмат табылган жок.");

        return;
    }


    localStorage.setItem(
        "kagCart",
        JSON.stringify(order.items)
    );


    location.href = "checkout.html";

}


function deleteOrder(index){

    if(!confirm(
        "Бул заказды өчүрүүнү каалайсызбы?"
    )){

        return;

    }


    orders.splice(index,1);


    localStorage.setItem(
        "kagOrders",
        JSON.stringify(orders)
    );


    renderOrders();

}


renderOrders();

</script>

</body>
</html>
