<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KAG — Заказ</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .ticket-page {
      max-width: 1050px;
      margin: auto;
      padding: 40px 20px 80px;
    }

    .back-link {
      color: var(--cream);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 25px;
    }

    .back-link:hover {
      color: var(--gold);
    }

    .ticket-header {
      background: var(--green-light);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .ticket-number {
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
    }

    .ticket-header h1 {
      font-size: 32px;
      margin: 8px 0;
    }

    .ticket-master {
      color: var(--muted);
    }

    .ticket-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }

    .card {
      background: var(--green-light);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 22px;
    }

    /* TRACKING */

    .tracking {
      position: relative;
    }

    .tracking-step {
      position: relative;
      display: flex;
      gap: 18px;
      min-height: 75px;
    }

    .tracking-step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 15px;
      top: 32px;
      width: 2px;
      height: 48px;
      background: rgba(255,255,255,.1);
    }

    .tracking-step.done:not(:last-child)::after {
      background: var(--gold);
    }

    .tracking-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      flex-shrink: 0;
    }

    .tracking-step.done .tracking-icon,
    .tracking-step.current .tracking-icon {
      background: var(--gold);
      color: var(--green);
    }

    .tracking-step.current .tracking-icon {
      box-shadow: 0 0 0 5px rgba(212,175,55,.12);
    }

    .tracking-name {
      font-weight: 800;
      padding-top: 6px;
    }

    .tracking-description {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    /* INFO */

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: var(--muted);
    }

    .value {
      text-align: right;
      font-weight: 700;
    }

    /* PRICE */

    .total {
      font-size: 30px;
      font-weight: 900;
      color: var(--gold);
      margin: 15px 0;
    }

    /* BUTTONS */

    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      margin-top: 10px;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--green);
    }

    .btn-secondary {
      border: 1px solid var(--border);
      color: var(--cream);
    }

    .btn-danger {
      border: 1px solid rgba(255,80,80,.25);
      color: #ff9a9a;
      background: rgba(255,80,80,.05);
    }

    .review-box {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: rgba(212,175,55,.08);
      border: 1px solid var(--border);
    }

    .stars {
      display: flex;
      gap: 5px;
      margin: 12px 0;
    }

    .star {
      border: none;
      background: transparent;
      color: rgba(255,255,255,.25);
      font-size: 30px;
      cursor: pointer;
    }

    .star.selected {
      color: var(--gold);
    }

    .not-found {
      text-align: center;
      padding: 70px 20px;
    }

    @media (max-width: 800px) {
      .ticket-layout {
        grid-template-columns: 1fr;
      }

      .ticket-header h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container">

    <a href="index.html" class="logo">KΛG</a>

    <nav class="nav">
      <a href="index.html">Башкы бет</a>
      <a href="marketplace.html">Кызматтар</a>
      <a href="add-service.html">Кызмат кошуу</a>
      <a href="my-tickets.html">Заказдарым</a>
      <a href="profile.html">Профиль</a>
    </nav>

  </div>
</header>


<main class="ticket-page">

  <a href="my-tickets.html" class="back-link">
    ← Заказдарым
  </a>

  <div id="ticketContainer"></div>

</main>


<script>

/* =====================================
   STATUS FLOW
===================================== */

const statuses = [

  {
    name: "Заказ түзүлдү",
    icon: "📝",
    description: "Кардар жаңы заказ түздү."
  },

  {
    name: "Кабыл алынды",
    icon: "✓",
    description: "Мастер заказды кабыл алды."
  },

  {
    name: "Жолдо",
    icon: "🚗",
    description: "Мастер кардардын дарегине жол тартты."
  },

  {
    name: "Келди",
    icon: "📍",
    description: "Мастер кардардын дарегине келди."
  },

  {
    name: "Иштеп жатат",
    icon: "🔧",
    description: "Кызмат көрсөтүлүп жатат."
  },

  {
    name: "Бүттү",
    icon: "✅",
    description: "Заказ ийгиликтүү аяктады."
  }

];


/* =====================================
   URL
===================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const orderId =
  params.get("id");


/* =====================================
   LOAD ORDER
===================================== */

function getOrders() {

  return JSON.parse(
    localStorage.getItem("kagOrders")
  ) || [];

}


function getOrder() {

  const orders =
    getOrders();

  return orders.find(
    order =>
      String(order.id) ===
      String(orderId)
  );

}


let order =
  getOrder();


/* =====================================
   SAVE ORDER
===================================== */

function saveOrder(updatedOrder) {

  const orders =
    getOrders();

  const index =
    orders.findIndex(
      item =>
        String(item.id) ===
        String(updatedOrder.id)
    );

  if (index !== -1) {

    orders[index] =
      updatedOrder;

    localStorage.setItem(
      "kagOrders",
      JSON.stringify(orders)
    );

  }

}


/* =====================================
   STATUS INDEX
===================================== */

function statusIndex(status) {

  const index =
    statuses.findIndex(
      item =>
        item.name === status
    );

  return index >= 0
    ? index
    : 0;

}


/* =====================================
   RENDER
===================================== */

function renderTicket() {

  const container =
    document.getElementById(
      "ticketContainer"
    );


  if (!order) {

    container.innerHTML = `

      <div class="card not-found">

        <h1>
          Заказ табылган жок
        </h1>

        <p class="label">
          Бул заказ жок же өчүрүлгөн.
        </p>

        <a
          href="marketplace.html"
          class="btn btn-primary"
        >
          Кызматтарды көрүү
        </a>

      </div>

    `;

    return;

  }


  const current =
    statusIndex(
      order.status
    );


  let trackingHTML = "";


  statuses.forEach(
    (step, index) => {

      const done =
        index <= current;

      const currentClass =
        index === current
          ? "current"
          : "";


      trackingHTML += `

        <div
          class="tracking-step
          ${done ? "done" : ""}
          ${currentClass}"
        >

          <div class="tracking-icon">
            ${step.icon}
          </div>

          <div>

            <div class="tracking-name">
              ${step.name}
            </div>

            <div class="tracking-description">
              ${step.description}
            </div>

          </div>

        </div>

      `;

    }
  );


  const completed =
    order.status === "Бүттү";


  container.innerHTML = `

    <div class="ticket-header">

      <div class="ticket-number">
        ${order.id}
      </div>

      <h1>
        ${order.service}
      </h1>

      <div class="ticket-master">
        👤 ${order.master}
      </div>

    </div>


    <div class="ticket-layout">


      <!-- LEFT -->

      <div>


        <!-- TRACKING -->

        <div class="card">

          <h2>
            📍 Заказдын статусу
          </h2>

          <div class="tracking">
            ${trackingHTML}
          </div>

        </div>


        <!-- ORDER INFO -->

        <div class="card">

          <h2>
            📋 Заказ маалыматтары
          </h2>


          <div class="info-row">

            <span class="label">
              Көйгөй / тапшырма
            </span>

            <span class="value">
              ${order.problem}
            </span>

          </div>


          <div class="info-row">

            <span class="label">
              Дарек
            </span>

            <span class="value">
              ${order.address}
            </span>

          </div>


          <div class="info-row">

            <span class="label">
              Күн
            </span>

            <span class="value">
              ${order.date}
            </span>

          </div>


          <div class="info-row">

            <span class="label">
              Убакыт
            </span>

            <span class="value">
              ${order.time}
            </span>

          </div>


          <div class="info-row">

            <span class="label">
              Телефон
            </span>

            <span class="value">
              ${order.phone}
            </span>

          </div>


          <div class="info-row">

            <span class="label">
              Төлөм
            </span>

            <span class="value">
              ${order.payment}
            </span>

          </div>

        </div>


        <!-- REVIEW -->

        <div
          class="card"
          id="reviewBox"
          style="
            display:${completed ? "block" : "none"};
          "
        >

          <h2>
            ⭐ Мастерди баалаңыз
          </h2>

          <p class="label">
            Кызмат сизге жактыбы?
          </p>


          <div class="stars">

            <button class="star" data-rating="1">
              ★
            </button>

            <button class="star" data-rating="2">
              ★
            </button>

            <button class="star" data-rating="3">
              ★
            </button>

            <button class="star" data-rating="4">
              ★
            </button>

            <button class="star" data-rating="5">
              ★
            </button>

          </div>


          <button
            id="reviewBtn"
            class="btn btn-primary"
          >
            Бааны жөнөтүү
          </button>

        </div>


      </div>


      <!-- RIGHT -->

      <aside>


        <!-- PRICE -->

        <div class="card">

          <h2>
            💰 Төлөм
          </h2>

          <div class="total">
            ${order.price} сом
          </div>

          <div class="label">
            Төлөм ыкмасы:
            ${order.payment}
          </div>

        </div>


        <!-- MASTER -->

        <div class="card">

          <h2>
            👤 Мастер
          </h2>

          <div style="
            font-size:20px;
            font-weight:800;
            margin-bottom:8px;
          ">
            ${order.master}
          </div>

          <div class="label">
            ${order.category}
          </div>

          <a
            href="profile.html?id=${order.serviceId}"
            class="btn btn-secondary"
          >
            Профилди көрүү
          </a>

        </div>


        <!-- ACTIONS -->

        <div class="card">

          <a
            href="tel:"
            class="btn btn-primary"
          >
            📞 Мастерге чалуу
          </a>


          ${
            !completed
              ? `
                <button
                  id="cancelBtn"
                  class="btn btn-danger"
                >
                  Заказды жокко чыгаруу
                </button>
              `
              : ""
          }

        </div>

      </aside>


    </div>

  `;


  setupActions();

}


/* =====================================
   ACTIONS
===================================== */

function setupActions() {


  /* CANCEL */

  const cancelBtn =
    document.getElementById(
      "cancelBtn"
    );


  if (cancelBtn) {

    cancelBtn.addEventListener(
      "click",
      () => {

        const confirmCancel =
          confirm(
            "Бул заказды жокко чыгаргыңыз келеби?"
          );


        if (!confirmCancel)
          return;


        order.status =
          "Жокко чыгарылды";


        saveOrder(order);


        renderTicket();

      }
    );

  }


  /* REVIEW */

  const stars =
    document.querySelectorAll(
      ".star"
    );


  let selectedRating = 0;


  stars.forEach(star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        stars.forEach(
          item => {

            item.classList.toggle(
              "selected",
              Number(
                item.dataset.rating
              ) <= selectedRating
            );

          }
        );

      }
    );

  });


  const reviewBtn =
    document.getElementById(
      "reviewBtn"
    );


  if (reviewBtn) {

    reviewBtn.addEventListener(
      "click",
      () => {

        if (!selectedRating) {

          alert(
            "Баалоо үчүн жылдыз тандаңыз."
          );

          return;

        }


        order.userRating =
          selectedRating;


        saveOrder(order);


        alert(
          "⭐ Рахмат! Бааңыз сакталды."
        );


        reviewBtn.textContent =
          "✓ Баа берилди";


        reviewBtn.disabled =
          true;

      }
    );

  }

}


/* =====================================
   START
===================================== */

renderTicket();

</script>

</body>
</html>
