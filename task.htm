<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAG — Тапшырма түзүү</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    background:#06251B;
    color:#F4EBD0;
    font-family:Arial,sans-serif;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 25px;
    background:#041C15;
    border-bottom:1px solid #D4AF37;
}

.logo{
    color:#D4AF37;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

.nav a{
    color:#F4EBD0;
    text-decoration:none;
    margin-left:18px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:35px 20px;
}

.title{
    color:#D4AF37;
    font-size:32px;
    margin-bottom:10px;
}

.subtitle{
    color:#9fb5ad;
    margin-bottom:25px;
}

.card{
    background:#041C15;
    border:1px solid #174C3B;
    border-radius:18px;
    padding:25px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border-radius:10px;
    border:1px solid #28634f;
    background:#06251B;
    color:#F4EBD0;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#D4AF37;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.hint{
    color:#829b92;
    font-size:13px;
    margin-top:6px;
}

.btn{
    width:100%;
    padding:16px;
    margin-top:25px;
    border:0;
    border-radius:12px;
    background:#D4AF37;
    color:#06251B;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#D4AF37;
    text-decoration:none;
}

.success{
    text-align:center;
    padding:40px 20px;
}

.success-icon{
    font-size:60px;
}

.success-id{
    color:#D4AF37;
    font-weight:bold;
    font-size:20px;
}

@media(max-width:700px){

    .nav{
        display:none;
    }

    .row{
        grid-template-columns:1fr;
    }

    .title{
        font-size:27px;
    }
}
</style>

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        KΛG
    </a>

    <nav class="nav">

        <a href="index.html">
            Башкы бет
        </a>

        <a href="marketplace.html">
            Кызматтар
        </a>

        <a href="cart.html">
            🛒 Корзина
        </a>

        <a href="orders.html">
            📦 Заказдар
        </a>

        <a href="profile.html">
            Профиль
        </a>

    </nav>

</header>


<main class="container">

    <a href="marketplace.html" class="back">
        ← Кызматтарга кайтуу
    </a>

    <h1 class="title">
        📝 Тапшырма түзүү
    </h1>

    <p class="subtitle">
        Кандай жумуш керек экенин жазыңыз.
        Мастерлер сизге өз сунуштарын жөнөтүшөт.
    </p>


    <div id="taskFormContainer">

        <div class="card">

            <label>
                Тапшырманын аталышы
            </label>

            <input
                id="taskTitle"
                type="text"
                placeholder="Мисалы: Үйгө сантехник керек"
            >


            <label>
                Категория
            </label>

            <select id="taskCategory">

                <option value="">
                    Категорияны тандаңыз
                </option>

                <option value="plumbing">
                    🔧 Сантехника
                </option>

                <option value="electrician">
                    ⚡ Электрик
                </option>

                <option value="cleaning">
                    🧹 Тазалоо
                </option>

                <option value="construction">
                    🏗️ Курулуш
                </option>

                <option value="delivery">
                    🚚 Жеткирүү
                </option>

                <option value="it">
                    💻 IT & Digital
                </option>

                <option value="other">
                    📦 Башка
                </option>

            </select>


            <label>
                Тапшырманы толук сүрөттөңүз
            </label>

            <textarea
                id="taskDescription"
                placeholder="Эмне кылыш керек? Кандай көйгөй бар? Толук жазыңыз..."
            ></textarea>


            <div class="row">

                <div>

                    <label>
                        Дарек
                    </label>

                    <input
                        id="taskAddress"
                        type="text"
                        placeholder="Бишкек, район, көчө..."
                    >

                </div>


                <div>

                    <label>
                        Керектүү дата
                    </label>

                    <input
                        id="taskDate"
                        type="date"
                    >

                </div>

            </div>


            <div class="row">

                <div>

                    <label>
                        Болжолдуу бюджет
                    </label>

                    <input
                        id="taskBudget"
                        type="number"
                        min="0"
                        placeholder="Мисалы: 3000"
                    >

                    <div class="hint">
                        Сом менен
                    </div>

                </div>


                <div>

                    <label>
                        Байланыш телефону
                    </label>

                    <input
                        id="taskPhone"
                        type="tel"
                        placeholder="+996 555 00 00 00"
                    >

                </div>

            </div>


            <button
                class="btn"
                onclick="createTask()"
            >
                🚀 Тапшырманы жарыялоо
            </button>

        </div>

    </div>

</main>


<script>

function createTask(){

    const title =
        document.getElementById("taskTitle")
        .value.trim();

    const category =
        document.getElementById("taskCategory")
        .value;

    const description =
        document.getElementById("taskDescription")
        .value.trim();

    const address =
        document.getElementById("taskAddress")
        .value.trim();

    const date =
        document.getElementById("taskDate")
        .value;

    const budget =
        document.getElementById("taskBudget")
        .value;

    const phone =
        document.getElementById("taskPhone")
        .value.trim();


    if(!title){

        alert("Тапшырманын аталышын жазыңыз.");

        return;
    }


    if(!category){

        alert("Категорияны тандаңыз.");

        return;
    }


    if(!description){

        alert("Тапшырманы сүрөттөп жазыңыз.");

        return;
    }


    if(!address){

        alert("Даректи жазыңыз.");

        return;
    }


    if(!date){

        alert("Керектүү датаны тандаңыз.");

        return;
    }


    if(!phone){

        alert("Телефон номериңизди жазыңыз.");

        return;
    }


    const task = {

        id:
            "TASK-" +
            Date.now(),

        title:title,

        category:category,

        description:description,

        address:address,

        date:date,

        budget:
            Number(budget || 0),

        phone:phone,

        status:"Жаңы",

        createdAt:
            new Date().toISOString(),

        offers:[]

    };


    let tasks = JSON.parse(
        localStorage.getItem("kagTasks") || "[]"
    );


    tasks.unshift(task);


    localStorage.setItem(
        "kagTasks",
        JSON.stringify(tasks)
    );


    showSuccess(task);

}


function showSuccess(task){

    document.getElementById(
        "taskFormContainer"
    ).innerHTML = `

        <div class="card success">

            <div class="success-icon">
                ✅
            </div>

            <h2>
                Тапшырма ийгиликтүү жарыяланды!
            </h2>

            <p>
                Тапшырма номери:
            </p>

            <div class="success-id">
                ${task.id}
            </div>

            <p>
                Эми мастерлер сиздин тапшырмаңызды
                көрүп, бааларын сунуштай алышат.
            </p>


            <button
                class="btn"
                onclick="location.href='offers.html?task=${task.id}'"
            >
                👨‍🔧 Сунуштарды көрүү
            </button>


            <button
                class="btn"
                style="
                    background:#174C3B;
                    color:#F4EBD0;
                "
                onclick="location.href='marketplace.html'"
            >
                Кызматтарга кайтуу
            </button>

        </div>

    `;

}

</script>

</body>
</html>
