<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAG Tickets — Менин билетім</title>
  <link rel="stylesheet" href="ticket.css">
  <style>
    .my-tickets {
      max-width: 900px;
      margin: auto;
      padding: 60px 6%;
    }
    .page-title {
      margin-bottom: 35px;
    }
    .page-title .label {
      color: #D4AF37;
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: bold;
    }
    .page-title h1 {
      font-size: 42px;
      margin-top: 10px;
    }
    .ticket {
      background: #0b3326;
      border: 1px solid rgba(212,175,55,.35);
      border-radius: 22px;
      overflow: hidden;
    }
    .ticket-top {
      padding: 30px;
      display: flex;
      justify-content: space-between;
      gap: 25px;
      border-bottom: 1px dashed rgba(212,175,55,.4);
    }
    .ticket-event {
      flex: 1;
    }
    .ticket-event .category {
      color: #D4AF37;
      font-size: 12px;
      letter-spacing: 2px;
    }
    .ticket-event h2 {
      font-size: 32px;
      margin: 12px 0 20px;
    }
    .ticket-info {
      display: grid;
      gap: 10px;
      color: #c2baa7;
    }
    .ticket-info strong {
      color: #F4EBD0;
    }
    .qr {
      width: 180px;
      height: 180px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr img {
      width: 100%;
      height: 100%;
    }
    .ticket-bottom {
      padding: 25px 30px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }
    .ticket-data span {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .ticket-data strong {
      font-size: 16px;
    }
    .status {
      color: #70d49b;
    }
    .ticket-actions {
      margin-top: 25px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 13px 20px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #D4AF37;
      background: transparent;
      color: #D4AF37;
    }
    .action-btn.primary {
      background: #D4AF37;
      color: #06251B;
    }
    .empty {
      text-align: center;
      padding: 80px 20px;
      background: #0b3326;
      border-radius: 20px;
      border: 1px solid rgba(212,175,55,.2);
    }
    .empty-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .empty h2 {
      margin-bottom: 10px;
    }
    .empty p {
      color: #999;
      margin-bottom: 25px;
    }
    @media(max-width: 650px) {
      .ticket-top {
        flex-direction: column;
      }
      .qr {
        width: 200px;
        height: 200px;
        margin: auto;
      }
      .ticket-bottom {
        grid-template-columns: 1fr 1fr;
      }
      .page-title h1 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
<header class="header">
  <a href="index.html" class="logo">
    KΛG
  </a>
  <nav>
    <a href="index.html">Башкы бет</a>
    <a href="tickets.html">Tickets</a>
    <a href="my-tickets.html" class="active">
      Менин билеттерим
    </a>
  </nav>
  <button class="login-btn">
    Кирүү
  </button>
</header>
<main class="my-tickets">
  <div class="page-title">
    <div class="label">
      KΛG TICKETS
    </div>
    <h1>
      Менин билетім
    </h1>
  </div>
  <div id="ticketContainer"></div>
</main>
<script>
  const ticket =
    JSON.parse(
      localStorage.getItem("kagTicket")
    );
  function renderTicket() {
    const container =
      document.getElementById(
        "ticketContainer"
      );
    if (!ticket) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">
            🎫
          </div>
          <h2>
            Сизде азырынча билет жок
          </h2>
          <p>
            Кызыктуу иш-чараларды карап,
            билет сатып алыңыз.
          </p>
          <a
            href="tickets.html"
            class="action-btn primary">
            Билеттерди көрүү
          </a>
        </div>
      `;
      return;
    }
    const qrData =
      encodeURIComponent(
        ticket.id +
        "|" +
        ticket.event +
        "|" +
        ticket.name
      );
    container.innerHTML = `
      <div class="ticket">
        <div class="ticket-top">
          <div class="ticket-event">
            <div class="category">
              KΛG TICKETS
            </div>
            <h2>
              ${ticket.event}
            </h2>
            <div class="ticket-info">
              <div>
                📅
                <strong>
                  ${ticket.date}
                </strong>
              </div>
              <div>
                📍
                <strong>
                  ${ticket.location}
                </strong>
              </div>
              <div>
                👤
                <strong>
                  ${ticket.name}
                </strong>
              </div>
            </div>
          </div>
          <div class="qr">
            <img
              src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${qrData}"
              alt="KAG Ticket QR">
          </div>
        </div>
        <div class="ticket-bottom">
          <div class="ticket-data">
            <span>
              Билет номери
            </span>
            <strong>
              ${ticket.id}
            </strong>
          </div>
          <div class="ticket-data">
            <span>
              Жалпы сумма
            </span>
            <strong>
              ${ticket.total.toLocaleString()} сом
            </strong>
          </div>
          <div class="ticket-data">
            <span>
              Статус
            </span>
            <strong class="status">
              ✓ Төлөндү
            </strong>
          </div>
        </div>
      </div>
      <div class="ticket-actions">
        <button
          class="action-btn primary"
          onclick="window.print()">
          🖨 Билетти сактоо
        </button>
        <button
          class="action-btn"
          onclick="shareTicket()">
          📤 Бөлүшүү
        </button>
        <a
          href="tickets.html"
          class="action-btn">
          🎫 Дагы билет алуу
        </a>
      </div>
    `;
  }
  function shareTicket() {
    if (
      navigator.share
    ) {
      navigator.share({
        title:
          "KAG Tickets",
        text:
          `Мен ${ticket.event} иш-чарасына билет алдым. Билет № ${ticket.id}`
      });
    } else {
      alert(
        "Билет номери: " +
        ticket.id
      );
    }
  }
  renderTicket();
</script>
</body>
</html>
