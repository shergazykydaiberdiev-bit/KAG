<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KAG — Менин заказдарым</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .orders-page {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px 80px;
    }

    .orders-header {
      margin-bottom: 30px;
    }

    .orders-header h1 {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .orders-header p {
      color: var(--muted);
    }

    .orders-list {
      display: grid;
      gap: 18px;
    }

    .order-card {
      background: var(--green-light);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .order-number {
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
    }

    .order-title {
      font-size: 22px;
      font-weight: 800;
      margin: 7px 0;
    }

    .master {
      color: var(--muted);
    }

    .status {
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      background: rgba(212,175,55,.12);
      color: var(--gold);
    }

    .status.completed {
      color: #75d69a;
      background: rgba(117,214,154,.1);
    }

    .status.cancelled {
      color: #ff8d8d;
      background: rgba(255,80,80,.1);
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin: 25px 0;
    }

    .step {
      height: 5px;
      border-radius: 10px;
      background: rgba(255,255,255,.1);
    }

    .step.active {
      background: var(--gold);
    }

    .status-text {
      color: var(--cream);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .detail {
      padding: 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.12);
    }

    .detail-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: 700;
    }

    .order-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .price {
      font-size: 22px;
      font-weight: 900;
    }

    .details-btn {
      padding: 11px 17px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--cream);
      text-decoration: none;
      font-weight: 700;
    }

    .details-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      background: var(--green-light);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty p {
      color: var(--muted);
    }

    .market-btn {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 22px;
      border-radius: 12px;
      background: var(--gold);
      color: var(--green);
      text-decoration: none;
      font-weight: 900;
    }

    @media (max-width: 700px) {
      .orders-header h1 {
        font-size: 32px;
      }

      .order-top {
        flex-direction: column;
      }

      .order-details {
        grid-template-columns: 1fr;
      }

      .progress {
        grid-template-columns: repeat(3, 1fr);
        row-gap: 8px;
      }

      .order-bottom {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
      }

      .details-btn {
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container">

    <a href="index.html" class="logo">KΛG</a>

    <nav class="nav">
      <a href="index.html">Башкы бет</a>
      <a href="marketplace.html">Кызматтар</a>
      <a href="add-service.html">Кызмат кошуу</a>
      <a href="my-tickets.html">Заказдарым</a>
      <a href="profile.html">Профиль</a>
    </nav>

  </div>
</header>


<main class="orders-page">

  <div class="orders-header">

    <h1>Менин заказдарым</h1>

    <p>
      Заказдарыңызды жана алардын статусун көзөмөлдөңүз.
    </p>

  </div>


  <div id="ordersList" class="orders-list"></div>

</main>


<script>

const ordersList =
  document.getElementById("ordersList");


/* =================================
   STATUS FLOW
================================= */

const statuses = [
  "Заказ түзүлдү",
  "Кабыл алынды",
  "Жолдо",
  "Келди",
  "Иштеп жатат",
  "Бүттү"
];


function getStatusIndex(status) {

  const index =
    statuses.indexOf(status);

  return index >= 0 ? index : 0;

}


/* =================================
   FORMAT DATE
================================= */

function formatDate(date) {

  if (!date) return "—";

  const d = new Date(date);

  return d.toLocaleDateString("ky-KG", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });

}


/* =================================
   RENDER ORDERS
================================= */

function renderOrders() {

  const orders =
    JSON.parse(
      localStorage.getItem("kagOrders")
    ) || [];


  ordersList.innerHTML = "";


  if (orders.length === 0) {

    ordersList.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📦
        </div>

        <h2>
          Азырынча заказ жок
        </h2>

        <p>
          Marketplace'тен керектүү кызматты таап,
          биринчи заказыңызды бериңиз.
        </p>

        <a
          href="marketplace.html"
          class="market-btn"
        >
          Кызматтарды көрүү
        </a>

      </div>

    `;

    return;
  }


  orders.forEach(order => {

    const statusIndex =
      getStatusIndex(order.status);


    const isCompleted =
      order.status === "Бүттү";


    const isCancelled =
      order.status === "Жокко чыгарылды";


    let progressHTML = "";


    for (
      let i = 0;
      i < statuses.length;
      i++
    ) {

      progressHTML += `

        <div
          class="step ${
            i <= statusIndex &&
            !isCancelled
              ? "active"
              : ""
          }"
        ></div>

      `;

    }


    const statusClass =
      isCompleted
        ? "completed"
        : isCancelled
          ? "cancelled"
          : "";


    const orderDate =
      formatDate(order.createdAt);


    const serviceDate =
      order.date
        ? formatDate(order.date)
        : "—";


    const card =
      document.createElement("div");


    card.className =
      "order-card";


    card.innerHTML = `

      <div class="order-top">

        <div>

          <div class="order-number">
            ${order.id}
          </div>

          <div class="order-title">
            ${order.service}
          </div>

          <div class="master">
            👤 ${order.master}
          </div>

        </div>


        <div class="status ${statusClass}">
          ${order.status}
        </div>

      </div>


      <div class="progress">
        ${progressHTML}
      </div>


      <div class="status-text">

        ${
          isCompleted
            ? "✅ Кызмат ийгиликтүү аяктады."
            : isCancelled
              ? "❌ Заказ жокко чыгарылды."
              : "⏳ Заказдын аткарылышы уланууда."
        }

      </div>


      <div class="order-details">

        <div class="detail">

          <div class="detail-label">
            📍 Дарек
          </div>

          <div class="detail-value">
            ${order.address}
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            📅 Күн
          </div>

          <div class="detail-value">
            ${serviceDate}
          </div>

        </div>


        <div class="detail">

          <div class="detail-label">
            ⏰ Убакыт
          </div>

          <div class="detail-value">
            ${order.time}
          </div>

        </div>

      </div>


      <div class="order-bottom">

        <div>

          <div class="detail-label">
            Жалпы сумма
          </div>

          <div class="price">
            ${order.price} сом
          </div>

        </div>


        <a
          href="ticket-details.html?id=${order.id}"
          class="details-btn"
        >
          Заказды ачуу →
        </a>

      </div>


      <div
        class="muted"
        style="margin-top:15px;font-size:12px;"
      >
        Түзүлгөн: ${orderDate}
      </div>

    `;


    ordersList.appendChild(card);

  });

}


renderOrders();

</script>

</body>
</html>
