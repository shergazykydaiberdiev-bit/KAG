<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAG Platform — Добавить услугу</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
kagGreen: { 800: '#064e3b', 900: '#022c22' },
kagGold: { 500: '#d97706', 600: '#b45309' }
}
}
}
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
<!-- Header Navigation -->
<header class="bg-slate-950 border-b border-emerald-900/50 sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
<div class="flex items-center space-x-8">
<a href="index.html" class="text-2xl font-extrabold text-amber-500 flex items-center gap-2">
<i class="fa-solid fa-gem text-emerald-500"></i> KAG Platform
</a>
<nav class="hidden md:flex space-x-6 text-sm font-medium">
<a href="index.html" class="text-slate-300 hover:text-amber-400 transition">Главная</a>
<a href="marketplace.html" class="text-slate-300 hover:text-amber-400 transition">Маркетплейс</a>
<a href="tickets.html" class="text-slate-300 hover:text-amber-400 transition">Билеты</a>
<a href="add-service.html" class="text-amber-400 transition">+ Добавить услугу</a>
</nav>
</div>
<div class="flex items-center space-x-4">
<a href="checkout.html" class="relative p-2 text-slate-300 hover:text-amber-400 transition" title="Корзина / Оплата">
<i class="fa-solid fa-cart-shopping text-xl"></i>
</a>
<a href="profile.html" class="p-2 text-slate-300 hover:text-amber-400 transition" title="Профиль">
<i class="fa-solid fa-user text-xl"></i>
</a>
<a href="login.html" class="hidden sm:inline-flex items-center px-4 py-2 border border-amber-500 text-amber-500 rounded-xl hover:bg-amber-500/10 font-medium transition text-sm">
Войти
</a>
</div>
</div>
<!-- Mobile Navigation bar -->
<div class="md:hidden flex justify-around bg-slate-950 border-t border-emerald-900/30 py-3 text-xs text-slate-300">
<a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house mb-1"></i>Главная</a>
<a href="marketplace.html" class="flex flex-col items-center"><i class="fa-solid fa-store mb-1"></i>Маркет</a>
<a href="tickets.html" class="flex flex-col items-center"><i class="fa-solid fa-ticket mb-1"></i>Билеты</a>
<a href="checkout.html" class="flex flex-col items-center"><i class="fa-solid fa-cart-shopping mb-1"></i>Корзина</a>
<a href="profile.html" class="flex flex-col items-center"><i class="fa-solid fa-user mb-1"></i>Профиль</a>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
<!-- Page Title Section -->
<div class="border-b border-emerald-900/40 pb-6">
<h1 class="text-3xl font-extrabold text-white flex items-center gap-3">
<i class="fa-solid fa-circle-plus text-amber-500"></i> Публикация новой услуги
</h1>
<p class="text-slate-400 text-sm mt-1">Заполните детали вашей услуги, чтобы она появилась на маркетплейсе KAG Platform.</p>
</div>
<!-- Add Service Form Card -->
<div class="bg-slate-950 p-8 rounded-3xl border border-emerald-900/40 shadow-2xl space-y-6">
<form onsubmit="event.preventDefault(); alert('Услуга успешно добавлена на маркетплейс!'); window.location.href='marketplace.html';" class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block text-xs font-semibold text-slate-300 mb-2">Название услуги</label>
<input type="text" required placeholder="Например: Разработка Telegram Bot" class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
</div>
<div>
<label class="block text-xs font-semibold text-slate-300 mb-2">Категория</label>
<select class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
<option>Разработка (Web / Apps)</option>
<option>Дизайн (UI/UX / Branding)</option>
<option>Маркетинг & SEO</option>
<option>Консультации & Менторство</option>
</select>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block text-xs font-semibold text-slate-300 mb-2">Стоимость (в сомах)</label>
<input type="number" required placeholder="10000" class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
</div>
<div>
<label class="block text-xs font-semibold text-slate-300 mb-2">Срок выполнения (дней)</label>
<input type="number" placeholder="5" class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
</div>
</div>
<div>
<label class="block text-xs font-semibold text-slate-300 mb-2">Подробное описание услуги</label>
<textarea rows="5" required placeholder="Опишите, что входит в вашу услугу, стек технологий или этапы работы..." class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
</div>
<div class="pt-4 flex items-center justify-end gap-4">
<a href="marketplace.html" class="px-6 py-3 rounded-xl border border-emerald-900/60 text-slate-300 hover:border-amber-500 transition text-sm font-medium">
Отмена
</a>
<button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-8 py-3 rounded-xl font-bold text-sm transition shadow-lg">
Опубликовать услугу
</button>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="bg-slate-950 border-t border-emerald-900/50 py-8 mt-auto">
<div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-400">
© 2026 KAG Platform. Все права защищены.
</div>
</footer>
<script src="script.js"></script>
</body>
</html>
