<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAG — Кызмат кошуу</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .service-page {
            min-height: 85vh;
            padding: 60px 0;
        }

        .service-form {
            max-width: 700px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(212,175,55,.3);
            background: rgba(255,255,255,.035);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .form-title p {
            color: #9fafa8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid rgba(212,175,55,.25);
            background: rgba(255,255,255,.05);
            color: #F4EBD0;
            outline: none;
            font-size: 15px;
        }

        .form-group select option {
            background: #06251B;
            color: #F4EBD0;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #D4AF37;
        }

        .price-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 9px;
            background: #D4AF37;
            color: #06251B;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: .9;
        }

        .success {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(212,175,55,.4);
            color: #D4AF37;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #9fafa8;
        }

        .back-link:hover {
            color: #D4AF37;
        }

        @media(max-width:600px) {
            .service-form {
                padding: 25px 18px;
            }
            .price-row {
                grid-template-columns: 1fr;
            }
            .form-title h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container nav">

        <a href="index.html" class="logo">
            K<span>Λ</span>G
        </a>

        <nav class="menu">

            <a href="marketplace.html" data-kg="Кызматтар" data-ru="Услуги">Кызматтар</a>
            <a href="add-service.html" data-kg="Кызмат кошуу" data-ru="Добавить услугу">Кызмат кошуу</a>
        </nav>

        <div class="nav-right">
            <div class="language">
                <button id="kgBtn" class="active">KG</button>
                <span>|</span>
                <button id="ruBtn">RU</button>
            </div>

            <a href="login.html" class="login-btn"
               data-kg="Кирүү" data-ru="Войти">
                Кирүү
            </a>
        </div>

    </div>
</header>

    <div class="container">
