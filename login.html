<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAG — Кирүү</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.035);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-logo {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #D4AF37;
            margin-bottom: 15px;
        }

        .auth-title {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #9fafa8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .auth-tab {
            border: none;
            background: transparent;
            color: #9fafa8;
            padding: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .auth-tab.active {
            color: #D4AF37;
            border-bottom: 2px solid #D4AF37;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.05);
            color: #F4EBD0;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #D4AF37;
        }

        .auth-submit {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 9px;
            background: #D4AF37;
            color: #06251B;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #9fafa8;
            font-size: 14px;
        }

        .back-home:hover {
            color: #D4AF37;
        }

        .message {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #D4AF37;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="container nav">

        <a href="index.html" class="logo">
            K<span>Λ</span>G
        </a>

        <a href="index.html" class="login-btn">
            ← Башкы бет
        </a>

    </div>
</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">KΛG</div>

        <h1 class="auth-title" id="authTitle">
            Кош келиңиз!
        </h1>

        <p class="auth-subtitle" id="authSubtitle">
            KAG аккаунтуңузга кириңиз
        </p>


        <div class="auth-tabs">

            <button
                class="auth-tab active"
                id="loginTab"
                onclick="showLogin()">
                Кирүү
            </button>

            <button
                class="auth-tab"
                id="registerTab"
                onclick="showRegister()">
                Катталуу
            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="example@email.com"
                    required>
            </div>


            <div class="form-group">
                <label>Сырсөз</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="••••••••"
                    required>
            </div>


            <button type="submit" class="auth-submit">
                Кирүү
            </button>

        </form>


        <!-- REGISTER -->

        <form id="registerForm" style="display:none;">

            <div class="form-group">
                <label>Атыңыз</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Атыңыз"
                    required>
            </div>


            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="example@email.com"
                    required>
            </div>


            <div class="form-group">
                <label>Сырсөз</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Минимум 6 символ"
                    minlength="6"
                    required>
            </div>


            <button type="submit" class="auth-submit">
                Катталуу
            </button>

        </form>


        <div class="message" id="message"></div>


        <a href="index.html" class="back-home">
            ← KAG башкы бетине кайтуу
        </a>

    </div>

</main>


<script>

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");

    const message = document.getElementById("message");


    function showLogin() {

        loginForm.style.display = "block";
        registerForm.style.display = "none";

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        authTitle.textContent = "Кош келиңиз!";
        authSubtitle.textContent = "KAG аккаунтуңузга кириңиз";

        message.style.display = "none";
    }


    function showRegister() {

        loginForm.style.display = "none";
        registerForm.style.display = "block";

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

        authTitle.textContent = "KAG'га кошулуңуз";
        authSubtitle.textContent = "Жаңы аккаунт түзүңүз";

        message.style.display = "none";
    }


    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        message.textContent =
            "Кирүү системасы кийинки этапта Supabase менен туташтырылат.";

        message.style.display = "block";
    });


    registerForm.addEventListener("submit", function(event) {

        event.preventDefault();

        message.textContent =
            "Каттоо системасы кийинки этапта Supabase менен туташтырылат.";

        message.style.display = "block";
    });

</script>

</body>
</html>
