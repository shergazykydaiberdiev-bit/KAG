<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAG — Кирүү</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #06251B;
            color: #F4EBD0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 6%;
            border-bottom: 1px solid rgba(212,175,55,.2);
            background: #0D3427;
        }

        .logo {
            color: #D4AF37;
            font-size: 30px;
            font-weight: 800;
            text-decoration: none;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .box {
            width: 100%;
            max-width: 460px;
            background: #0D3427;
            border: 1px solid rgba(212,175,55,.2);
            border-radius: 22px;
            padding: 32px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9BAAA2;
            margin-bottom: 28px;
        }

        .role-title {
            font-size: 14px;
            color: #9BAAA2;
            margin-bottom: 10px;
        }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .role {
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(244,235,208,.12);
            color: #F4EBD0;
            cursor: pointer;
            text-align: center;
        }

        .role.active {
            border-color: #D4AF37;
            background: rgba(212,175,55,.12);
            color: #D4AF37;
        }

        label {
            display: block;
            font-size: 13px;
            color: #9BAAA2;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 11px;
            border: 1px solid rgba(244,235,208,.15);
            background: #06251B;
            color: #F4EBD0;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #D4AF37;
        }

        .main-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #D4AF37;
            color: #06251B;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .main-btn:hover {
            opacity: .9;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #9BAAA2;
            font-size: 14px;
        }

        .switch span {
            color: #D4AF37;
            cursor: pointer;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .success {
            margin-top: 15px;
            padding: 13px;
            background: rgba(50,180,100,.1);
            border: 1px solid rgba(50,180,100,.2);
            border-radius: 10px;
            color: #8ee0a8;
            font-size: 14px;
            display: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #9BAAA2;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .box {
                padding: 24px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">KAG</a>
</header>

<div class="login-wrapper">

    <div class="box">

        <h1 id="title">KAG'га кирүү</h1>

        <p class="subtitle" id="subtitle">
            Кызматтарды таап, заказ бериңиз.
        </p>

        <div class="role-title">
            Сиз кимсиз?
        </div>

        <div class="roles">

            <div
                class="role active"
                id="customerRole"
                onclick="selectRole('customer')"
            >
                👤 Кардар
            </div>

            <div
                class="role"
                id="masterRole"
                onclick="selectRole('master')"
            >
                🔧 Мастер
            </div>

        </div>


        <form id="authForm">

            <div id="nameField" class="hidden">

                <label>Атыңыз</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Мисалы: Шергазы"
                >

            </div>


            <label>Телефон номери</label>

            <input
                type="tel"
                id="phone"
                placeholder="+996 700 000 000"
                required
            >


            <label>Сыр сөз</label>

            <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
            >


            <div id="confirmField" class="hidden">

                <label>Сыр сөздү кайталаңыз</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="••••••••"
                >

            </div>


            <button
                type="submit"
                class="main-btn"
                id="submitBtn"
            >
                Кирүү
            </button>

        </form>


        <div class="success" id="success"></div>


        <div class="switch">

            <span id="switchText">
                Аккаунтуңуз жокпу?
            </span>

            <span
                id="switchButton"
                onclick="toggleMode()"
            >
                Катталуу
            </span>

        </div>


        <a href="index.html" class="back">
            ← Башкы бетке кайтуу
        </a>

    </div>

</div>


<script>

let role = "customer";
let registerMode = false;


function selectRole(selectedRole) {

    role = selectedRole;

    document
        .getElementById("customerRole")
        .classList.remove("active");

    document
        .getElementById("masterRole")
        .classList.remove("active");


    if (role === "customer") {

        document
            .getElementById("customerRole")
            .classList.add("active");

        document.getElementById("subtitle").textContent =
            "Кызматтарды таап, заказ бериңиз.";

    } else {

        document
            .getElementById("masterRole")
            .classList.add("active");

        document.getElementById("subtitle").textContent =
            "Заказдарды алып, кызмат көрсөтүңүз.";

    }

}


function toggleMode() {

    registerMode = !registerMode;

    const nameField =
        document.getElementById("nameField");

    const confirmField =
        document.getElementById("confirmField");

    const title =
        document.getElementById("title");

    const submitBtn =
        document.getElementById("submitBtn");

    const switchText =
        document.getElementById("switchText");

    const switchButton =
        document.getElementById("switchButton");


    if (registerMode) {

        title.textContent = "KAG'га катталуу";

        nameField.classList.remove("hidden");

        confirmField.classList.remove("hidden");

        submitBtn.textContent = "Катталуу";

        switchText.textContent =
            "Аккаунтуңуз барбы?";

        switchButton.textContent =
            "Кирүү";

    } else {

        title.textContent = "KAG'га кирүү";

        nameField.classList.add("hidden");

        confirmField.classList.add("hidden");

        submitBtn.textContent = "Кирүү";

        switchText.textContent =
            "Аккаунтуңуз жокпу?";

        switchButton.textContent =
            "Катталуу";

    }

}


document
    .getElementById("authForm")
    .addEventListener("submit", function(e) {

        e.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (registerMode) {

            if (!name) {

                alert("Атыңызды жазыңыз.");

                return;

            }

            if (password.length < 6) {

                alert("Сыр сөз кеминде 6 символ болушу керек.");

                return;

            }

            if (password !== confirmPassword) {

                alert("Сыр сөздөр дал келген жок.");

                return;

            }


            const user = {

                id: "user_" + Date.now(),

                name: name,

                phone: phone,

                role: role,

                createdAt: new Date().toISOString()

            };


            localStorage.setItem(
                "kagUser",
                JSON.stringify(user)
            );


            showSuccess(
                "Каттоо ийгиликтүү! KAG аккаунтуңуз түзүлдү."
            );


            setTimeout(() => {

                if (role === "master") {

                    window.location.href = "tickets.html";

                } else {

                    window.location.href = "marketplace.html";

                }

            }, 1000);


        } else {

            const existingUser =
                JSON.parse(
                    localStorage.getItem("kagUser")
                );


            if (!existingUser) {

                alert(
                    "Аккаунт табылган жок. Адегенде катталыңыз."
                );

                return;

            }


            if (existingUser.phone !== phone) {

                alert("Телефон номери туура эмес.");

                return;

            }


            showSuccess(
                "Кош келиңиз, " +
                existingUser.name +
                "!"
            );


            setTimeout(() => {

                if (existingUser.role === "master") {

                    window.location.href = "tickets.html";

                } else {

                    window.location.href = "marketplace.html";

                }

            }, 1000);

        }

    });


function showSuccess(message) {

    const success =
        document.getElementById("success");

    success.textContent = message;

    success.style.display = "block";

}

</script>

</body>
</html>
