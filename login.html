<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAG — Кирүү</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #06251B;
            color: #F4EBD0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 430px;
        }
        .logo {
            text-align: center;
            color: #D4AF37;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .card {
            background: #0b3326;
            border: 1px solid rgba(212,175,55,.3);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #06251B;
            padding: 5px;
            border-radius: 11px;
            margin-bottom: 25px;
        }
        .tab {
            border: none;
            background: transparent;
            color: #aaa;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab.active {
            background: #D4AF37;
            color: #06251B;
        }
        .mode-title {
            text-align: center;
            margin-bottom: 15px;
        }
        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role {
            border: 1px solid rgba(212,175,55,.25);
            background: transparent;
            color: #F4EBD0;
            border-radius: 11px;
            padding: 14px 8px;
            cursor: pointer;
        }
        .role.active {
            border-color: #D4AF37;
            background: rgba(212,175,55,.12);
            color: #D4AF37;
        }
        .role-icon {
            display: block;
            font-size: 25px;
            margin-bottom: 6px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #cfc7b2;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(244,235,208,.15);
            background: #06251B;
            color: #F4EBD0;
            outline: none;
            font-size: 15px;
        }
        input:focus {
            border-color: #D4AF37;
        }
        .main-btn {
            width: 100%;
            border: none;
            background: #D4AF37;
            color: #06251B;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .forgot {
            text-align: right;
            margin: 10px 0 18px;
        }
        .forgot a {
            color: #D4AF37;
            font-size: 13px;
            cursor: pointer;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0;
            color: #777;
            font-size: 12px;
        }
        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: rgba(244,235,208,.12);
            flex: 1;
        }
        .home {
            display: block;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }
        .home:hover {
            color: #D4AF37;
        }
        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(212,175,55,.1);
            color: #D4AF37;
            text-align: center;
            font-size: 13px;
        }
        @media (max-width: 450px) {
            .card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">KΛG</div>
    <div class="subtitle">
        Кыргызстандагы кызматтар платформасы
    </div>
    <div class="card">
        <!-- LOGIN / REGISTER -->
        <div class="tabs">
            <button
                id="loginTab"
                class="tab active"
                onclick="showLogin()">
                Кирүү
            </button>
            <button
                id="registerTab"
                class="tab"
                onclick="showRegister()">
                Катталуу
            </button>
        </div>
        <!-- ROLE -->
        <div class="mode-title">
            Сиз KAG'ды ким катары колдоносуз?
        </div>
        <div class="roles">
            <button
                id="customerRole"
                class="role active"
                onclick="selectRole('customer')">
                <span class="role-icon">👤</span>
                Кардар
            </button>
            <button
                id="executorRole"
                class="role"
                onclick="selectRole('executor')">
                <span class="role-icon">🛠️</span>
                Мастер
            </button>
        </div>
        <!-- REGISTER NAME -->
        <div
            id="nameGroup"
            class="input-group"
            style="display:none;">
            <label>
                Аты-жөнү
            </label>
            <input
                id="name"
                type="text"
                placeholder="Мисалы: Азамат С.">
        </div>
        <!-- PHONE -->
        <div class="input-group">
            <label>
                Телефон номери
            </label>
            <input
                id="phone"
                type="tel"
                placeholder="+996 700 000 000">
        </div>
        <!-- PASSWORD -->
        <div class="input-group">
            <label>
                Сырсөз
            </label>
            <input
                id="password"
                type="password"
                placeholder="••••••••">
        </div>
        <div
            id="forgot"
            class="forgot">
            <a onclick="forgotPassword()">
                Сырсөздү унуттуңузбу?
            </a>
        </div>
        <button
            id="mainButton"
            class="main-btn"
            onclick="login()">
            Кирүү
        </button>
        <div
            id="message"
            class="message">
        </div>
        <div class="divider">
            KAG
        </div>
        <a
            href="index.html"
            class="home">
            ← Башкы бетке кайтуу
        </a>
    </div>
</div>
<script>
let currentMode = "login";
let currentRole = "customer";
function showLogin() {
    currentMode = "login";
    document
        .getElementById("loginTab")
        .classList.add("active");
    document
        .getElementById("registerTab")
        .classList.remove("active");
    document
        .getElementById("nameGroup")
        .style.display = "none";
    document
        .getElementById("forgot")
        .style.display = "block";
    document
        .getElementById("mainButton")
        .textContent = "Кирүү";
}
function showRegister() {
    currentMode = "register";
    document
        .getElementById("registerTab")
        .classList.add("active");
    document
        .getElementById("loginTab")
        .classList.remove("active");
    document
        .getElementById("nameGroup")
        .style.display = "block";
    document
        .getElementById("forgot")
        .style.display = "none";
    document
        .getElementById("mainButton")
        .textContent = "Катталуу";
}
function selectRole(role) {
    currentRole = role;
    document
        .getElementById("customerRole")
        .classList.toggle(
            "active",
            role === "customer"
        );
    document
        .getElementById("executorRole")
        .classList.toggle(
            "active",
            role === "executor"
        );
}
function showMessage(text) {
    const message =
        document.getElementById("message");
    message.textContent = text;
    message.style.display = "block";
}
function login() {
    const name =
        document.getElementById("name").value.trim();
    const phone =
        document.getElementById("phone").value.trim();
    const password =
        document.getElementById("password").value.trim();
    if (!phone || !password) {
        showMessage(
            "⚠️ Телефон жана сырсөздү толтуруңуз."
        );
        return;
    }
    if (
        currentMode === "register"
        && !name
    ) {
        showMessage(
            "⚠️ Аты-жөнүңүздү жазыңыз."
        );
        return;
    }
    const user = {
        name:
            name ||
            localStorage.getItem("kag_profile_name") ||
            "KAG колдонуучусу",
        phone: phone,
        role: currentRole,
        loggedIn: true,
        createdAt:
            new Date().toISOString()
    };
    localStorage.setItem(
        "kag_user",
        JSON.stringify(user)
    );
    if (name) {
        localStorage.setItem(
            "kag_profile_name",
            name
        );
    }
    showMessage(
        currentMode === "register"
            ? "✅ Каттоо ийгиликтүү!"
            : "✅ Кирүү ийгиликтүү!"
    );
    setTimeout(function() {
        if (currentRole === "executor") {
            window.location.href =
                "executor-dashboard.html";
        } else {
            window.location.href =
                "marketplace.html";
        }
    }, 700);
}
function forgotPassword() {
    const phone =
        prompt(
            "Телефон номериңизди жазыңыз:"
        );
    if (!phone) return;
    alert(
        "📱 Сырсөздү калыбына келтирүү функциясы кийин SMS аркылуу иштейт."
    );
}
</script>
</body>
</html>
