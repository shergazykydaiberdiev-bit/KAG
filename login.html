<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAG Platform — Вход и Регистрация</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
kagGreen: { 800: '#064e3b', 900: '#022c22' },
kagGold: { 500: '#d97706', 600: '#b45309' }
}
}
}
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
<!-- Header Navigation -->
<header class="bg-slate-950 border-b border-emerald-900/50">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
<a href="index.html" class="text-2xl font-extrabold text-amber-500 flex items-center gap-2">
<i class="fa-solid fa-gem text-emerald-500"></i> KAG Platform
</a>
<a href="index.html" class="text-sm font-medium text-slate-300 hover:text-amber-400 transition">
<i class="fa-solid fa-arrow-left mr-1"></i> На главную
</a>
</div>
</header>
<!-- Main Content / Login Card -->
<main class="flex-grow flex items-center justify-center px-4 py-12">
<div class="max-w-md w-full bg-slate-950 border border-emerald-900/50 rounded-3xl p-8 shadow-2xl space-y-6">
<div class="text-center space-y-2">
<div class="h-16 w-16 bg-emerald-950 border border-emerald-900/60 rounded-2xl mx-auto flex items-center justify-center text-amber-500 text-2xl font-bold shadow-inner">
<i class="fa-solid fa-lock"></i>
</div>
<h1 class="text-2xl font-extrabold text-white">Добро пожаловать</h1>
<p class="text-xs text-slate-400">Войдите в свой аккаунт KAG Platform для продолжения</p>
</div>
<!-- Login Form -->
<form onsubmit="event.preventDefault(); showNotification('Успешный вход в систему!', 'success'); setTimeout(() => window.location.href='profile.html', 1000);" class="space-y-4">
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">Email или телефон</label>
<input type="text" required placeholder="shergazy@kagplatform.kg" class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
</div>
<div>
<div class="flex justify-between items-center mb-1">
<label class="text-xs font-semibold text-slate-300">Пароль</label>
<a href="#" class="text-xs text-amber-500 hover:underline">Забыли пароль?</a>
</div>
<input type="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
</div>
<button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 py-3.5 rounded-xl font-bold text-sm transition shadow-lg mt-2">
Войти в систему
</button>
</form>
<div class="border-t border-emerald-900/30 pt-4 text-center text-xs text-slate-400">
Нет аккаунта? <a href="#" onclick="alert('Регистрация временно доступна через администратора платформы.');" class="text-amber-500 font-bold hover:underline">Создать аккаунт</a>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-slate-950 border-t border-emerald-900/50 py-6 text-center text-xs text-slate-400">
© 2026 KAG Platform. Все права защищены.
</footer>
<script src="script.js"></script>
</body>
</html>
