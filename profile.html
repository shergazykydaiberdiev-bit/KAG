<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAG — Профиль</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .profile-page {
            padding: 60px 0;
            min-height: 80vh;
        }

        .profile-card {
            max-width: 850px;
            margin: auto;
            padding: 35px;
            border: 1px solid rgba(212,175,55,.3);
            border-radius: 20px;
            background: rgba(255,255,255,.035);
        }

        .profile-head {
            display: flex;
            align-items: center;
            gap: 25px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(212,175,55,.2);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #D4AF37;
            color: #06251B;
            font-size: 35px;
            font-weight: bold;
        }

        .profile-name {
            font-size: 28px;
        }

        .profile-email {
            color: #9fafa8;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 18px;
            margin-top: 30px;
        }

        .profile-item {
            padding: 22px;
            border: 1px solid rgba(212,175,55,.15);
            border-radius: 12px;
            background: rgba(255,255,255,.025);
        }

        .profile-item span {
            display: block;
            color: #9fafa8;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .profile-btn {
            padding: 13px 20px;
            border-radius: 8px;
            border: 1px solid #D4AF37;
            color: #D4AF37;
            background: transparent;
            cursor: pointer;
        }

        .profile-btn.gold {
            background: #D4AF37;
            color: #06251B;
        }

        @media(max-width:600px) {
            .profile-head {
                flex-direction: column;
                text-align: center;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="container nav">

        <a href="index.html" class="logo">
            K<span>Λ</span>G
        </a>

        <div class="nav-right">
            <a href="index.html" class="login-btn">Башкы бет</a>
        </div>

    </div>
</header>


<main class="profile-page">

    <div class="container">

        <div class="profile-card">

            <div class="profile-head">

                <div class="avatar" id="avatar">
                    K
                </div>

                <div>
                    <h1 class="profile-name" id="profileName">
                        KAG Колдонуучу
                    </h1>

                    <p class="profile-email" id="profileEmail">
                        Email көрсөтүлгөн жок
                    </p>
                </div>

            </div>


            <div class="profile-grid">

                <div class="profile-item">
                    <span>📍 Шаар</span>
                    Бишкек
                </div>

                <div class="profile-item">
                    <span>👤 Статус</span>
                    Кардар
                </div>

                <div class="profile-item">
                    <span>⭐ Рейтинг</span>
                    Азырынча рейтинг жок
                </div>

                <div class="profile-item">
                    <span>🛠️ Кызматтар</span>
                    0 кызмат
                </div>

            </div>


            <div class="profile-actions">

                <button class="profile-btn gold"
                        onclick="addService()">
                    + Кызмат кошуу
                </button>

                <button class="profile-btn"
                        onclick="editProfile()">
                    ✏️ Профилди өзгөртүү
                </button>

                <button class="profile-btn"
                        onclick="logout()">
                    🚪 Чыгуу
                </button>

            </div>

        </div>

    </div>

</main>


<script>

function addService() {
    alert("Кызмат кошуу бөлүмүн кийинки этапта ачабыз.");
}

function editProfile() {
    alert("Профиль өзгөртүү функциясы кийинки этапта кошулат.");
}

function logout() {
    localStorage.removeItem("KAG_user");
    window.location.href = "index.html";
}

const user = JSON.parse(
    localStorage.getItem("KAG_user")
);

if (user) {

    document.getElementById("profileName").textContent =
        user.name || "KAG Колдонуучу";

    document.getElementById("profileEmail").textContent =
        user.email || "Email көрсөтүлгөн жок";

    if (user.name) {
        document.getElementById("avatar").textContent =
            user.name.charAt(0).toUpperCase();
    }
}

</script>

</body>
</html>
