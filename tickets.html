<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAG — Мастердин заказдары</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #06251B;
            color: #F4EBD0;
        }

        header {
            background: #0D3427;
            border-bottom: 1px solid rgba(212,175,55,.25);
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #D4AF37;
            font-size: 28px;
            font-weight: 800;
            text-decoration: none;
        }

        .back {
            color: #F4EBD0;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px 60px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9BAAA2;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: #0D3427;
            border: 1px solid rgba(212,175,55,.18);
            border-radius: 16px;
            padding: 20px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #D4AF37;
        }

        .stat-title {
            color: #9BAAA2;
            margin-top: 5px;
            font-size: 14px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter {
            background: #0D3427;
            color: #F4EBD0;
            border: 1px solid rgba(212,175,55,.2);
            padding: 10px 17px;
            border-radius: 30px;
            cursor: pointer;
        }

        .filter.active,
        .filter:hover {
            background: #D4AF37;
            color: #06251B;
        }

        .order {
            background: #0D3427;
            border: 1px solid rgba(212,175,55,.18);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .order-id {
            color: #D4AF37;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .service-name {
            font-size: 21px;
            font-weight: 700;
        }

        .status {
            padding: 8px 13px;
            border-radius: 20px;
            background: rgba(212,175,55,.12);
            color: #D4AF37;
            font-size: 13px;
            white-space: nowrap;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .detail {
            background: rgba(0,0,0,.12);
            padding: 13px;
            border-radius: 10px;
        }

        .label {
            color: #9BAAA2;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .value {
            color: #F4EBD0;
            font-size: 14px;
        }

        .price {
            color: #D4AF37;
            font-size: 22px;
            font-weight: 800;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button,
        .open-btn {
            border: none;
            padding: 11px 17px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .primary {
            background: #D4AF37;
            color: #06251B;
        }

        .secondary {
            background: rgba(244,235,208,.08);
            color: #F4EBD0;
            border: 1px solid rgba(244,235,208,.15);
        }

        .danger {
            background: rgba(180,50,50,.15);
            color: #ff8d8d;
            border: 1px solid rgba(255,100,100,.2);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            background: #0D3427;
            border-radius: 18px;
            color: #9BAAA2;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .details {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">KAG</a>
    <a href="marketplace.html" class="back">← Marketplace</a>
</header>

<main class="container">

    <h1>Мастердин заказдары</h1>

    <p class="subtitle">
        Кирген заказдарды көрүп, иштин статусун башкарыңыз.
    </p>

    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="allCount">0</div>
            <div class="stat-title">Бардык заказ</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="newCount">0</div>
            <div class="stat-title">Жаңы</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="activeCount">0</div>
            <div class="stat-title">Иштеп жаткан</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="doneCount">0</div>
            <div class="stat-title">Бүткөн</div>
        </div>
    </div>

    <div class="filters">

        <button class="filter active" onclick="setFilter('all', this)">
            Баары
        </button>

        <button class="filter" onclick="setFilter('new', this)">
            Жаңы
        </button>

        <button class="filter" onclick="setFilter('active', this)">
            Активдүү
        </button>

        <button class="filter" onclick="setFilter('done', this)">
            Бүткөн
        </button>

    </div>

    <div id="orders"></div>

</main>

<script>

let orders = JSON.parse(localStorage.getItem("kagOrders")) || [];

let currentFilter = "all";


function saveOrders() {

    localStorage.setItem(
        "kagOrders",
        JSON.stringify(orders)
    );

}


function getNextStatus(status) {

    const flow = {
        "Заказ түзүлдү": "Кабыл алынды",
        "Кабыл алынды": "Жолдо",
        "Жолдо": "Келди",
        "Келди": "Иштеп жатат",
        "Иштеп жатат": "Бүттү"
    };

    return flow[status] || null;

}


function getNextButtonText(status) {

    const buttons = {
        "Заказ түзүлдү": "✓ Кабыл алуу",
        "Кабыл алынды": "🚗 Жолго чыгуу",
        "Жолдо": "📍 Келдим",
        "Келди": "🔧 Иштеп баштоо",
        "Иштеп жатат": "✓ Бүтүрүү"
    };

    return buttons[status] || null;

}


function updateStatus(id) {

    const order = orders.find(o => String(o.id) === String(id));

    if (!order) return;

    const nextStatus = getNextStatus(order.status);

    if (!nextStatus) return;

    order.status = nextStatus;

    order.updatedAt = new Date().toISOString();

    saveOrders();

    render();

}


function cancelOrder(id) {

    const order = orders.find(o => String(o.id) === String(id));

    if (!order) return;

    const confirmCancel = confirm(
        "Бул заказды жокко чыгаргыңыз келеби?"
    );

    if (!confirmCancel) return;

    order.status = "Жокко чыгарылды";

    order.updatedAt = new Date().toISOString();

    saveOrders();

    render();

}


function setFilter(filter, element) {

    currentFilter = filter;

    document
        .querySelectorAll(".filter")
        .forEach(btn => btn.classList.remove("active"));

    element.classList.add("active");

    render();

}


function isActive(status) {

    return [
        "Кабыл алынды",
        "Жолдо",
        "Келди",
        "Иштеп жатат"
    ].includes(status);

}


function filteredOrders() {

    if (currentFilter === "new") {

        return orders.filter(
            order => order.status === "Заказ түзүлдү"
        );

    }

    if (currentFilter === "active") {

        return orders.filter(
            order => isActive(order.status)
        );

    }

    if (currentFilter === "done") {

        return orders.filter(
            order =>
                order.status === "Бүттү" ||
                order.status === "Жокко чыгарылды"
        );

    }

    return orders;

}


function renderStats() {

    document.getElementById("allCount").textContent =
        orders.length;

    document.getElementById("newCount").textContent =
        orders.filter(
            o => o.status === "Заказ түзүлдү"
        ).length;

    document.getElementById("activeCount").textContent =
        orders.filter(
            o => isActive(o.status)
        ).length;

    document.getElementById("doneCount").textContent =
        orders.filter(
            o =>
                o.status === "Бүттү"
        ).length;

}


function render() {

    renderStats();

    const container =
        document.getElementById("orders");

    const list = filteredOrders();

    if (list.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h2>Заказ жок</h2>
                <p style="margin-top:10px;">
                    Бул бөлүмдө азырынча заказдар көрүнбөйт.
                </p>
            </div>
        `;

        return;

    }

    container.innerHTML = list.map(order => {

        const nextStatus =
            getNextStatus(order.status);

        const nextButton =
            getNextButtonText(order.status);

        return `

            <div class="order">

                <div class="order-top">

                    <div>

                        <div class="order-id">
                            ${order.id || "KAG заказ"}
                        </div>

                        <div class="service-name">
                            ${order.service || "KAG кызматы"}
                        </div>

                    </div>

                    <div class="status">
                        ${order.status || "Заказ түзүлдү"}
                    </div>

                </div>


                <div class="details">

                    <div class="detail">
                        <div class="label">
                            Кардардын тапшырмасы
                        </div>

                        <div class="value">
                            ${order.task || "Көрсөтүлгөн эмес"}
                        </div>
                    </div>


                    <div class="detail">
                        <div class="label">
                            Дарек
                        </div>

                        <div class="value">
                            ${order.address || "Көрсөтүлгөн эмес"}
                        </div>
                    </div>


                    <div class="detail">
                        <div class="label">
                            Күнү
                        </div>

                        <div class="value">
                            ${order.date || "—"}
                        </div>
                    </div>


                    <div class="detail">
                        <div class="label">
                            Убактысы
                        </div>

                        <div class="value">
                            ${order.time || "—"}
                        </div>
                    </div>


                    <div class="detail">
                        <div class="label">
                            Телефон
                        </div>

                        <div class="value">
                            ${order.phone || "—"}
                        </div>
                    </div>


                    <div class="detail">
                        <div class="label">
                            Төлөм
                        </div>

                        <div class="value">
                            ${order.payment || "Накталай"}
                        </div>
                    </div>

                </div>


                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:15px;
                    margin-bottom:18px;
                ">

                    <span style="color:#9BAAA2;">
                        Заказдын суммасы
                    </span>

                    <span class="price">
                        ${order.total || order.price || 0} сом
                    </span>

                </div>


                <div class="actions">

                    ${
                        nextStatus
                        ?
                        `
                        <button
                            class="primary"
                            onclick="updateStatus('${order.id}')"
                        >
                            ${nextButton}
                        </button>
                        `
                        :
                        ""
                    }


                    <a
                        class="open-btn secondary"
                        href="ticket-details.html?id=${order.id}"
                    >
                        Заказды ачуу
                    </a>


                    ${
                        order.status !== "Бүттү" &&
                        order.status !== "Жокко чыгарылды"
                        ?
                        `
                        <button
                            class="danger"
                            onclick="cancelOrder('${order.id}')"
                        >
                            Жокко чыгаруу
                        </button>
                        `
                        :
                        ""
                    }

                </div>

            </div>

        `;

    }).join("");

}


render();

</script>

</body>
</html>
