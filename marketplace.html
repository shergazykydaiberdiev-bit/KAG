<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KAG — Кызматтар</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .market-page {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px 80px;
    }

    .market-head {
      text-align: center;
      margin-bottom: 35px;
    }

    .market-head h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .market-head p {
      color: var(--muted);
    }

    .market-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .market-search {
      flex: 1;
      padding: 15px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--green-light);
      color: white;
      font-size: 16px;
      outline: none;
    }

    .add-btn {
      padding: 15px 22px;
      border-radius: 12px;
      background: var(--gold);
      color: #06251B;
      text-decoration: none;
      font-weight: 800;
      white-space: nowrap;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .filter-btn {
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--cream);
      cursor: pointer;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--gold);
      color: #06251B;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .service-card {
      background: var(--green-light);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      transition: .2s;
    }

    .service-card:hover {
      transform: translateY(-3px);
    }

    .service-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .category {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
    }

    .online {
      color: #75d69a;
      font-size: 13px;
    }

    .offline {
      color: var(--muted);
      font-size: 13px;
    }

    .service-card h3 {
      font-size: 21px;
      margin: 8px 0;
    }

    .description {
      color: var(--muted);
      line-height: 1.5;
      min-height: 48px;
    }

    .location {
      margin-top: 15px;
      color: var(--cream);
      font-size: 14px;
    }

    .service-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .price {
      font-size: 20px;
      font-weight: 800;
    }

    .rating {
      color: var(--gold);
    }

    .card-buttons {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .card-btn {
      flex: 1;
      text-align: center;
      padding: 11px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid var(--border);
      color: var(--cream);
    }

    .card-btn.primary {
      background: var(--gold);
      color: #06251B;
      border: none;
    }

    .verified {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 8px;
      background: rgba(212,175,55,.12);
      color: var(--gold);
      font-size: 12px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .services-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .market-actions {
        flex-direction: column;
      }

      .market-head h1 {
        font-size: 32px;
      }

      .services-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container">

    <a href="index.html" class="logo">KΛG</a>

    <nav class="nav">
      <a href="index.html">Башкы бет</a>
      <a href="marketplace.html">Кызматтар</a>
      <a href="add-service.html">Кызмат кошуу</a>
      <a href="profile.html">Профиль</a>
    </nav>

  </div>
</header>


<main class="market-page">

  <div class="market-head">

    <h1>KAG Marketplace</h1>

    <p>
      Керектүү адисти таап, кызматка заказ бериңиз
    </p>

  </div>


  <div class="market-actions">

    <input
      type="text"
      id="search"
      class="market-search"
      placeholder="🔍 Кызмат же адис издеңиз..."
    >

    <a href="add-service.html" class="add-btn">
      + Кызмат кошуу
    </a>

  </div>


  <div class="filters">

    <button class="filter-btn active" data-category="all">
      Баары
    </button>

    <button class="filter-btn" data-category="Ремонт">
      🔧 Ремонт
    </button>

    <button class="filter-btn" data-category="Тазалоо">
      🧹 Тазалоо
    </button>

    <button class="filter-btn" data-category="Транспорт">
      🚚 Транспорт
    </button>

    <button class="filter-btn" data-category="IT">
      💻 IT
    </button>

    <button class="filter-btn" data-category="Фото / Видео">
      📸 Фото / Видео
    </button>

    <button class="filter-btn" data-category="Үй кызматтары">
      🏠 Үй кызматтары
    </button>

  </div>


  <div id="servicesGrid" class="services-grid"></div>

</main>


<script>

const grid = document.getElementById("servicesGrid");
const search = document.getElementById("search");
const filterButtons = document.querySelectorAll(".filter-btn");

let selectedCategory = "all";


/* Демо кызматтар */

const demoServices = [

  {
    id: "demo1",
    category: "Ремонт",
    title: "Сантехникалык иштер",
    description: "Кран, труба, суу агуу жана сантехника оңдоо.",
    price: 1200,
    priceType: "баштап",
    city: "Бишкек",
    availability: "online",
    rating: 4.9,
    reviews: 124,
    verified: true
  },

  {
    id: "demo2",
    category: "Тазалоо",
    title: "Үй тазалоо",
    description: "Үй, квартира жана офис үчүн профессионалдык тазалоо.",
    price: 1000,
    priceType: "баштап",
    city: "Бишкек",
    availability: "online",
    rating: 4.8,
    reviews: 89,
    verified: true
  },

  {
    id: "demo3",
    category: "Транспорт",
    title: "Жүк ташуу",
    description: "Бишкек ичинде жүк ташуу жана көчүрүү кызматы.",
    price: 800,
    priceType: "баштап",
    city: "Бишкек",
    availability: "offline",
    rating: 4.7,
    reviews: 63,
    verified: true
  },

  {
    id: "demo4",
    category: "IT",
    title: "Компьютер оңдоо",
    description: "Windows орнотуу, компьютер жана ноутбук оңдоо.",
    price: 1500,
    priceType: "баштап",
    city: "Бишкек",
    availability: "online",
    rating: 5.0,
    reviews: 51,
    verified: true
  },

  {
    id: "demo5",
    category: "Фото / Видео",
    title: "Фото жана видео тартуу",
    description: "Той, иш-чара жана бизнес үчүн фото-видео.",
    price: 3000,
    priceType: "баштап",
    city: "Бишкек",
    availability: "offline",
    rating: 4.9,
    reviews: 37,
    verified: true
  }

];


function getServices() {

  const saved =
    JSON.parse(localStorage.getItem("kagServices")) || [];

  return [...saved, ...demoServices];

}


function renderServices() {

  const services = getServices();

  const searchText =
    search.value.toLowerCase().trim();


  const filtered = services.filter(service => {

    const matchesCategory =
      selectedCategory === "all" ||
      service.category === selectedCategory;

    const text =
      (
        service.title +
        " " +
        service.description +
        " " +
        service.city +
        " " +
        service.category
      ).toLowerCase();

    const matchesSearch =
      text.includes(searchText);

    return matchesCategory && matchesSearch;

  });


  grid.innerHTML = "";


  if (filtered.length === 0) {

    grid.innerHTML = `
      <div class="empty">
        <h2>Кызмат табылган жок</h2>
        <p>Башка издөө сөзүн же категорияны колдонуп көрүңүз.</p>
      </div>
    `;

    return;
  }


  filtered.forEach(service => {

    const online =
      service.availability === "online";


    const priceText =
      service.priceType === "макулдашуу"
        ? "Баасы макулдашуу боюнча"
        : `${service.price} сом`;


    const rating =
      service.rating > 0
        ? `⭐ ${service.rating}`
        : "⭐ Жаңы";


    const verified =
      service.verified
        ? `<span class="verified">✓ KAG Verified</span>`
        : "";


    const card = document.createElement("div");

    card.className = "service-card";


    card.innerHTML = `

      <div class="service-top">

        <span class="category">
          ${service.category}
        </span>

        <span class="${online ? "online" : "offline"}">
          ${online ? "● Азыр бош" : "○ Бош эмес"}
        </span>

      </div>


      <h3>
        ${service.title}
      </h3>


      <div class="description">
        ${service.description}
      </div>


      ${verified}


      <div class="location">
        📍 ${service.city}
      </div>


      <div class="service-bottom">

        <div class="price">
          ${priceText}
        </div>

        <div class="rating">
          ${rating}
        </div>

      </div>


      <div class="card-buttons">

        <a
          href="profile.html?id=${service.id}"
          class="card-btn"
        >
          Профиль
        </a>

        <a
          href="checkout.html?service=${service.id}"
          class="card-btn primary"
        >
          Заказ берүү
        </a>

      </div>

    `;


    grid.appendChild(card);

  });

}


/* Издөө */

search.addEventListener("input", renderServices);


/* Категория */

filterButtons.forEach(button => {

  button.addEventListener("click", () => {

    filterButtons.forEach(btn =>
      btn.classList.remove("active")
    );

    button.classList.add("active");

    selectedCategory =
      button.dataset.category;

    renderServices();

  });

});


/* Баштапкы жүктөө */

renderServices();

</script>

</body>
</html>
