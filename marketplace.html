<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAG — Marketplace</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .marketplace {
            min-height: 90vh;
            padding: 55px 0;
        }

        .market-head {
            text-align: center;
            margin-bottom: 35px;
        }

        .market-head h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        .market-head p {
            color: #9fafa8;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 35px;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid rgba(212,175,55,.25);
            background: rgba(255,255,255,.05);
            color: #F4EBD0;
            outline: none;
        }

        .filters select option {
            background: #06251B;
        }

        .service-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .market-card {
            overflow: hidden;
            border: 1px solid rgba(212,175,55,.18);
            border-radius: 16px;
            background: rgba(255,255,255,.035);
            transition: .3s;
        }

        .market-card:hover {
            transform: translateY(-5px);
            border-color: #D4AF37;
        }

        .service-image {
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212,175,55,.08);
            font-size: 55px;
            overflow: hidden;
        }

        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .market-info {
            padding: 22px;
        }

        .category {
            display: inline-block;
            color: #D4AF37;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .market-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .description {
            color: #9fafa8;
            font-size: 14px;
            min-height: 45px;
        }

        .service-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }

        .price {
            color: #D4AF37;
            font-size: 20px;
            font-weight: bold;
        }
