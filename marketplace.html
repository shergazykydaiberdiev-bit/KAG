<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAG — Кызматтар</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #06251B;
            color: #F4EBD0;
        }

        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #D4AF37;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #D4AF37;
        }

        header a {
            color: #F4EBD0;
            text-decoration: none;
            margin-left: 15px;
        }

        .hero {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .hero h1 {
            color: #D4AF37;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
        }

        #search {
            width: 90%;
            max-width: 600px;
            padding: 15px;
            margin-top: 25px;
            border-radius: 30px;
            border: 1px solid #D4AF37;
            background: #0b3025;
            color: white;
            font-size: 16px;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .category {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #D4AF37;
            background: transparent;
            color: #F4EBD0;
            cursor: pointer;
        }

        .category.active,
        .category:hover {
            background: #D4AF37;
            color: #06251B;
        }

        .title {
            text-align: center;
            color: #D4AF37;
            margin: 30px 0;
        }

        #services {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #0b3025;
            border: 1px solid rgba(212,175,55,.4);
            border-radius: 18px;
            padding: 25px;
        }

        .icon {
            font-size: 45px;
        }

        .card h3 {
            font-size: 22px;
            margin: 15px 0 8px;
        }

        .cat {
            color: #D4AF37;
            margin-bottom: 12px;
        }

        .description {
            color: #ddd;
            line-height: 1.5;
            min-height: 45px;
        }

        .price {
            color: #D4AF37;
            font-size: 20px;
            font-weight: bold;
            margin-top: 18px;
        }

        .btn {
            display: block;
            margin-top: 18px;
            padding: 12px;
            text-align: center;
            background: #D4AF37;
            color: #06251B;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
        }

        .error {
            color: #ff7777;
        }

        .task {
            text-align: center;
            padding: 70px 20px;
        }

        .task h2 {
            color: #D4AF37;
        }

        .task a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #D4AF37;
            color: #06251B;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid rgba(212,175,55,.3);
        }
    </style>
</head>

<body>

<header>
    <div class="logo">KAG</div>

    <div>
        <a href="index.html">Башкы бет</a>
        <a href="login.html">Кирүү</a>
    </div>
</header>


<section class="hero">

    <h1>KAG Кызматтары</h1>

    <p>
        Керектүү кызматты таап, ишти профессионалдарга тапшырыңыз
    </p>

    <input
        id="search"
        type="text"
        placeholder="Кызмат издөө..."
    >

</section>


<div
    class="categories"
    id="categories"
>
    <button
        class="category active"
        onclick="selectCategory('all', this)"
    >
        Баары
    </button>
</div>


<h2 class="title">
    Бардык кызматтар
</h2>


<div id="services">

    <div class="message">
        Кызматтар жүктөлүүдө...
    </div>

</div>


<section class="task">

    <h2>
        Керектүү кызматты таппай жатасызбы?
    </h2>

    <p>
        Өзүңүздүн тапшырмаңызды түзүп,
        KAG мастерлеринен сунуш алыңыз.
    </p>

    <a href="add-task.html">
        Тапшырма түзүү
    </a>

</section>


<footer>
    © 2026 KAG
</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://kyudeeqjbksjczqidagc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_AdyXuaFhp9LaJBKAXm2_IQ_JsGPsp6Y";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


let services = [];
let currentCategory = "all";


async function loadServices() {

    const container =
        document.getElementById("services");

    container.innerHTML = `
        <div class="message">
            <h3>Supabase текшерилүүдө...</h3>
        </div>
    `;

    try {

        if (!window.supabase) {
            throw new Error(
                "Supabase китепканасы жүктөлгөн жок"
            );
        }

        const testClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        container.innerHTML = `
            <div class="message">
                <h3>Supabase туташты...</h3>
                <p>База текшерилүүдө...</p>
            </div>
        `;

        const result =
            await testClient
                .from("services")
                .select("*")
                .eq("is_active", true);

        if (result.error) {
            throw result.error;
        }

        services =
            result.data || [];

        container.innerHTML = `
            <div class="message">
                <h3>✅ Баары жакшы!</h3>
                <p>
                    ${services.length} кызмат табылды.
                </p>
            </div>
        `;

    } catch (error) {

        console.error(
            "SUPABASE ERROR:",
            error
        );

        container.innerHTML = `
            <div class="message error">
                <h3>❌ Ката чыкты</h3>
                <p>${error.message}</p>
            </div>
        `;

    }

}

    const container =
        document.getElementById("services");

    try {

        const result =
            await supabase
                .from("services")
                .select(
                    "id,name,category,description,icon,base_price,is_active"
                )
                .eq(
                    "is_active",
                    true
                )
                .order(
                    "id",
                    {
                        ascending: true
                    }
                );

        if (result.error) {

            throw result.error;

        }

        services =
            result.data || [];

        createCategories();

        showServices();

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="message error">
                <h3>Кызматтарды жүктөөдө ката кетти</h3>
                <p>${error.message}</p>
            </div>
        `;

    }

}


function createCategories() {

    const box =
        document.getElementById("categories");

    const categories =
        [...new Set(
            services
                .map(s => s.category)
                .filter(Boolean)
        )];

    box.innerHTML = `
        <button
            class="category active"
            onclick="selectCategory('all', this)"
        >
            Баары
        </button>
    `;

    categories.forEach(category => {

        box.innerHTML += `
            <button
                class="category"
                onclick="selectCategory(
                    '${category.replace(/'/g, "\\'")}',
                    this
                )"
            >
                ${category}
            </button>
        `;

    });

}


function selectCategory(
    category,
    button
) {

    currentCategory =
        category;

    document
        .querySelectorAll(".category")
        .forEach(b =>
            b.classList.remove("active")
        );

    button.classList.add("active");

    showServices();

}


function showServices() {

    const container =
        document.getElementById("services");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    let filtered =
        services;

    if (
        currentCategory !== "all"
    ) {

        filtered =
            filtered.filter(
                service =>
                    service.category ===
                    currentCategory
            );

    }

    if (search) {

        filtered =
            filtered.filter(service => {

                const text = (
                    (service.name || "") +
                    " " +
                    (service.category || "") +
                    " " +
                    (service.description || "")
                ).toLowerCase();

                return text.includes(search);

            });

    }


    if (!filtered.length) {

        container.innerHTML = `
            <div class="message">
                Кызмат табылган жок.
            </div>
        `;

        return;

    }


    container.innerHTML =
        filtered.map(service => {

            const price =
                service.base_price
                    ? Number(
                        service.base_price
                    ).toLocaleString("ru-RU")
                    : "Баасы сүйлөшүлөт";

            return `

                <div class="card">

                    <div class="icon">
                        ${service.icon || "🛠️"}
                    </div>

                    <h3>
                        ${service.name || "Кызмат"}
                    </h3>

                    <div class="cat">
                        ${service.category || ""}
                    </div>

                    <div class="description">
                        ${
                            service.description ||
                            "Профессионалдык кызмат"
                        }
                    </div>

                    <div class="price">
                        ${price} сомдон
                    </div>

                    <a
                        class="btn"
                        href="service-detail.html?service=${service.id}"
                    >
                        Кызматты көрүү
                    </a>

                </div>

            `;

        }).join("");

}


document
    .getElementById("search")
    .addEventListener(
        "input",
        showServices
    );


loadServices();

</script>

</body>
</html>
