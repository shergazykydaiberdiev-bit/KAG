<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAG — Заказды ырастоо</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    background:#06251B;
    color:#F4EBD0;
    margin:0;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 25px;
    background:#041C15;
    border-bottom:1px solid #D4AF37;
}

.logo{
    color:#D4AF37;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

.nav a{
    color:#F4EBD0;
    text-decoration:none;
    margin-left:20px;
}

.title{
    font-size:32px;
    color:#D4AF37;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

.card{
    background:#041C15;
    border:1px solid #174C3B;
    border-radius:16px;
    padding:22px;
    margin-bottom:15px;
}

.item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid #174C3B;
    padding:15px 0;
}

.item:last-child{
    border-bottom:none;
}

.item h3{
    margin:0 0 7px;
    color:#F4EBD0;
}

.item p{
    margin:4px 0;
    color:#9fb5ad;
    font-size:14px;
}

.price{
    color:#D4AF37;
    font-weight:bold;
    white-space:nowrap;
}

.remove{
    background:none;
    border:none;
    color:#ff7777;
    cursor:pointer;
    margin-top:8px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    color:#F4EBD0;
}

input,select{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    border-radius:10px;
    border:1px solid #28634f;
    background:#06251B;
    color:#fff;
    outline:none;
}

input:focus,select:focus{
    border-color:#D4AF37;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
    border-top:1px solid #28634f;
    padding-top:18px;
    margin-top:20px;
}

.total span:last-child{
    color:#D4AF37;
}

.btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#D4AF37;
    color:#06251B;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#9fb5ad;
}

.empty a{
    display:inline-block;
    margin-top:20px;
    color:#D4AF37;
}

.success{
    text-align:center;
    padding:50px 20px;
}

.success-icon{
    font-size:60px;
    margin-bottom:15px;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }

    .nav{
        display:none;
    }

    .title{
        font-size:26px;
    }

    .item{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        KΛG
    </a>

    <nav class="nav">
        <a href="index.html">Башкы бет</a>
        <a href="marketplace.html">Кызматтар</a>
        <a href="cart.html">🛒 Корзина</a>
        <a href="orders.html">📦 Заказдар</a>
        <a href="profile.html">Профиль</a>
    </nav>

</header>


<main class="container">

    <h1 class="title">Заказды ырастоо</h1>

    <div id="checkoutContent">

        <div class="grid">

            <!-- CART -->
            <section>

                <div class="card">

                    <h2>🛒 Сиздин корзинаңыз</h2>

                    <div id="cartItems"></div>

                </div>

            </section>


            <!-- PAYMENT -->
            <aside>

                <div class="card">

                    <h2>💳 Төлөм</h2>

                    <div id="summary"></div>

                    <label>Атыңыз</label>
                    <input
                        id="customerName"
                        type="text"
                        placeholder="Атыңыз"
                    >

                    <label>Телефон</label>
                    <input
                        id="customerPhone"
                        type="tel"
                        placeholder="+996 555 00 00 00"
                    >

                    <label>Төлөм ыкмасы</label>

                    <select id="paymentMethod">

                        <option value="cash">
                            Накталай
                        </option>

                        <option value="card">
                            Банк картасы
                        </option>

                        <option value="mbank">
                            MBank
                        </option>

                        <option value="odengi">
                            O!Dengi
                        </option>

                    </select>

                    <button
                        class="btn"
                        onclick="confirmOrder()"
                    >
                        Заказды ырастоо
                    </button>

                </div>

            </aside>

        </div>

    </div>

</main>


<script>

let cart = JSON.parse(
    localStorage.getItem("kagCart") || "[]"
);


function formatPrice(price){

    return Number(price || 0)
        .toLocaleString("ru-RU") + " сом";

}


function renderCart(){

    const container =
        document.getElementById("cartItems");

    const summary =
        document.getElementById("summary");


    if(cart.length === 0){

        container.innerHTML = `
            <div class="empty">
                <div style="font-size:50px;">🛒</div>

                <h3>Корзина бош</h3>

                <p>
                    Азырынча заказ тандалган жок.
                </p>

                <a href="marketplace.html">
                    Кызматтарды көрүү →
                </a>
            </div>
        `;

        summary.innerHTML = "";

        return;
    }


    let total = 0;


    container.innerHTML = cart.map((item,index)=>{

        const price =
            Number(item.price || 0) *
            Number(item.quantity || 1);

        total += price;


        return `
            <div class="item">

                <div>

                    <h3>
                        ${item.service || "KAG кызматы"}
                    </h3>

                    <p>
                        Категория:
                        ${item.category || "Кызмат"}
                    </p>

                    ${
                        item.address
                        ? `<p>📍 ${item.address}</p>`
                        : ""
                    }

                    ${
                        item.date
                        ? `<p>📅 ${item.date}</p>`
                        : ""
                    }

                    ${
                        item.note
                        ? `<p>📝 ${item.note}</p>`
                        : ""
                    }

                    <button
                        class="remove"
                        onclick="removeItem(${index})"
                    >
                        🗑 Өчүрүү
                    </button>

                </div>

                <div class="price">

                    ${formatPrice(price)}

                </div>

            </div>
        `;

    }).join("");


    summary.innerHTML = `

        <div>
            <div style="
                display:flex;
                justify-content:space-between;
                margin-bottom:10px;
            ">
                <span>Кызматтар:</span>

                <strong>
                    ${formatPrice(total)}
                </strong>
            </div>

            <div class="total">

                <span>Жалпы:</span>

                <span>
                    ${formatPrice(total)}
                </span>

            </div>
        </div>

    `;
}


function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem(
        "kagCart",
        JSON.stringify(cart)
    );

    renderCart();
}


function confirmOrder(){

    if(cart.length === 0){

        alert("Корзина бош.");

        return;
    }


    const name =
        document.getElementById("customerName").value.trim();

    const phone =
        document.getElementById("customerPhone").value.trim();

    const payment =
        document.getElementById("paymentMethod").value;


    if(!name){

        alert("Атыңызды жазыңыз.");

        return;
    }


    if(!phone){

        alert("Телефон номериңизди жазыңыз.");

        return;
    }


    let total = 0;

    cart.forEach(item => {

        total +=
            Number(item.price || 0) *
            Number(item.quantity || 1);

    });


    const order = {

        id:
            "KAG-" +
            Date.now(),

        items:[...cart],

        customerName:name,

        customerPhone:phone,

        paymentMethod:payment,

        total:total,

        status:"Жаңы заказ",

        createdAt:
            new Date().toISOString()

    };


    let orders = JSON.parse(
        localStorage.getItem("kagOrders") || "[]"
    );


    orders.unshift(order);


    localStorage.setItem(
        "kagOrders",
        JSON.stringify(orders)
    );


    // Корзинаны тазалоо
    localStorage.removeItem("kagCart");


    document.getElementById("checkoutContent").innerHTML = `

        <div class="card success">

            <div class="success-icon">
                ✅
            </div>

            <h2>
                Заказ ийгиликтүү кабыл алынды!
            </h2>

            <p>
                Заказ номери:
                <strong style="color:#D4AF37;">
                    ${order.id}
                </strong>
            </p>

            <p>
                Жалпы сумма:
                <strong style="color:#D4AF37;">
                    ${formatPrice(total)}
                </strong>
            </p>

            <button
                class="btn"
                onclick="location.href='orders.html'"
            >
                📦 Менин заказдарым
            </button>

            <button
                class="btn"
                onclick="location.href='marketplace.html'"
                style="
                    background:#174C3B;
                    color:#F4EBD0;
                "
            >
                Кызматтарга кайтуу
            </button>

        </div>

    `;
}


renderCart();

</script>

</body>
</html>
