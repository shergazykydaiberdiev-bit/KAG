<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAG — Мастерлердин сунуштары</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    background:#06251B;
    color:#F4EBD0;
    font-family:Arial,sans-serif;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 25px;
    background:#041C15;
    border-bottom:1px solid #D4AF37;
}

.logo{
    color:#D4AF37;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

.nav a{
    color:#F4EBD0;
    text-decoration:none;
    margin-left:18px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:30px 20px;
}

.back{
    color:#D4AF37;
    text-decoration:none;
}

.title{
    color:#D4AF37;
    font-size:32px;
    margin:20px 0 8px;
}

.subtitle{
    color:#9fb5ad;
    margin-bottom:25px;
}

.task-card,
.offer{
    background:#041C15;
    border:1px solid #174C3B;
    border-radius:16px;
    padding:22px;
    margin-bottom:18px;
}

.task-card{
    border-color:#D4AF37;
}

.task-title{
    font-size:23px;
    font-weight:bold;
    margin-bottom:10px;
}

.task-info{
    color:#9fb5ad;
    line-height:1.8;
    font-size:14px;
}

.offer{
    transition:.2s;
}

.offer:hover{
    border-color:#D4AF37;
}

.offer-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.master{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#174C3B;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.master-name{
    font-size:19px;
    font-weight:bold;
}

.rating{
    color:#D4AF37;
    font-size:14px;
    margin-top:5px;
}

.offer-price{
    color:#D4AF37;
    font-size:24px;
    font-weight:bold;
    white-space:nowrap;
}

.message{
    margin-top:15px;
    padding:15px;
    background:#06251B;
    border-radius:10px;
    color:#b8c9c3;
    line-height:1.6;
}

.meta{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-top:15px;
    color:#9fb5ad;
    font-size:14px;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:0;
    border-radius:11px;
    background:#D4AF37;
    color:#06251B;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}

.empty{
    text-align:center;
    padding:55px 20px;
}

.empty-icon{
    font-size:55px;
}

.no-task{
    text-align:center;
    padding:60px 20px;
    background:#041C15;
    border-radius:16px;
    border:1px solid #174C3B;
}

@media(max-width:700px){

    .nav{
        display:none;
    }

    .title{
        font-size:27px;
    }

    .offer-top{
        align-items:flex-start;
        flex-direction:column;
    }

    .offer-price{
        margin-top:10px;
    }
}
</style>

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        KΛG
    </a>

    <nav class="nav">

        <a href="index.html">
            Башкы бет
        </a>

        <a href="marketplace.html">
            Кызматтар
        </a>

        <a href="cart.html">
            🛒 Корзина
        </a>

        <a href="orders.html">
            📦 Заказдар
        </a>

        <a href="profile.html">
            Профиль
        </a>

    </nav>

</header>


<main class="container">

    <a href="marketplace.html" class="back">
        ← Артка
    </a>

    <h1 class="title">
        👨‍🔧 Мастерлердин сунуштары
    </h1>

    <p class="subtitle">
        Сиздин тапшырмаңыз боюнча келген сунуштарды салыштырыңыз.
    </p>


    <div id="content"></div>

</main>


<script>

const params =
    new URLSearchParams(window.location.search);

const taskId =
    params.get("task");


let tasks = JSON.parse(
    localStorage.getItem("kagTasks") || "[]"
);


let task =
    tasks.find(t => t.id === taskId);


/*
    ДЕМО МАСТЕРЛЕР

    Кийин Supabase аркылуу
    реалдуу мастерлердин сунуштары келет.
*/

const demoOffers = [

    {
        id:"OFFER-1001",
        master:"Азим Б.",
        rating:4.9,
        reviews:127,
        price:1500,
        time:"Бүгүн",
        message:"Тапшырманы аткара алам. Бүгүн келип көрүп, ишти сапаттуу бүтүрөм."
    },

    {
        id:"OFFER-1002",
        master:"Бекзат К.",
        rating:4.8,
        reviews:94,
        price:1300,
        time:"Эртең",
        message:"Бул иш боюнча тажрыйбам бар. Керектүү инструменттерим өзүмдө бар."
    },

    {
        id:"OFFER-1003",
        master:"Нурбек Т.",
        rating:5.0,
        reviews:63,
        price:1700,
        time:"Бүгүн кечинде",
        message:"Тез арада барып, тапшырманы аткарууга даярмын."
    }

];


function formatPrice(price){

    return Number(price || 0)
        .toLocaleString("ru-RU") + " сом";

}


function render(){

    const content =
        document.getElementById("content");


    if(!task){

        content.innerHTML = `

            <div class="no-task">

                <div class="empty-icon">
                    🔎
                </div>

                <h2>
                    Тапшырма табылган жок
                </h2>

                <p>
                    Тапшырмаңыздын шилтемеси туура эмес
                    же тапшырма өчүрүлгөн.
                </p>

                <button
                    class="btn"
                    onclick="location.href='task.html'"
                >
                    📝 Жаңы тапшырма түзүү
                </button>

            </div>

        `;

        return;
    }


    content.innerHTML = `

        <div class="task-card">

            <div class="task-title">
                ${task.title}
            </div>

            <div class="task-info">

                📋 ${task.description}

                <br>

                📍 ${task.address}

                <br>

                📅 ${task.date}

                ${
                    task.budget
                    ? `
                    <br>
                    💰 Бюджет:
                    ${formatPrice(task.budget)}
                    `
                    : ""
                }

                <br>

                🆔 ${task.id}

            </div>

        </div>


        <h2>
            Сунуштар
            (${demoOffers.length})
        </h2>


        <div>

            ${
                demoOffers.map((offer,index)=>`

                    <div class="offer">

                        <div class="offer-top">

                            <div class="master">

                                <div class="avatar">
                                    👨‍🔧
                                </div>

                                <div>

                                    <div class="master-name">
                                        ${offer.master}
                                    </div>

                                    <div class="rating">

                                        ⭐ ${offer.rating}

                                        · ${offer.reviews} заказ

                                    </div>

                                </div>

                            </div>


                            <div class="offer-price">

                                ${formatPrice(offer.price)}

                            </div>

                        </div>


                        <div class="message">

                            ${offer.message}

                        </div>


                        <div class="meta">

                            <span>
                                🕐 ${offer.time}
                            </span>

                            <span>
                                🛠 Тажрыйбалуу мастер
                            </span>

                            <span>
                                ✓ Текшерилген
                            </span>

                        </div>


                        <button
                            class="btn"
                            onclick="selectOffer(${index})"
                        >
                            ✓ Бул мастерди тандоо
                        </button>

                    </div>

                `).join("")
            }

        </div>

    `;

}


function selectOffer(index){

    const offer =
        demoOffers[index];


    if(!task){

        alert("Тапшырма табылган жок.");

        return;
    }


    /*
        Тандалган мастерди
        Checkout үчүн корзинага өткөрөбүз.
    */

    const cartItem = {

        id:
            "CART-" +
            Date.now(),

        service:
            task.title,

        category:
            task.category,

        price:
            offer.price,

        quantity:1,

        address:
            task.address,

        date:
            task.date,

        note:
            task.description,

        master:
            offer.master,

        masterRating:
            offer.rating,

        taskId:
            task.id,

        offerId:
            offer.id

    };


    localStorage.setItem(
        "kagCart",
        JSON.stringify([cartItem])
    );


    /*
        Тапшырманын статусун өзгөртөбүз.
    */

    task.status =
        "Мастер тандалды";

    task.selectedMaster =
        offer.master;

    task.selectedOffer =
        offer.id;


    localStorage.setItem(
        "kagTasks",
        JSON.stringify(tasks)
    );


    location.href =
        "checkout.html";

}


render();

</script>

</body>
</html>
