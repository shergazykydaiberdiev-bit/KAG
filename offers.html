<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAG — Мастерлердин сунуштары</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#06251B;
  color:#F4EBD0;
  min-height:100vh;
}

header{
  background:#041b13;
  border-bottom:1px solid #D4AF37;
  padding:16px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  color:#D4AF37;
  font-size:27px;
  font-weight:800;
  text-decoration:none;
}

nav{
  display:flex;
  gap:18px;
}

nav a{
  color:#F4EBD0;
  text-decoration:none;
  font-size:14px;
}

nav a:hover{
  color:#D4AF37;
}

.container{
  max-width:1000px;
  margin:40px auto;
  padding:0 20px;
}

h1{
  color:#D4AF37;
  margin-bottom:20px;
}

.card{
  background:#0a3023;
  border:1px solid rgba(212,175,55,.35);
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

.task-title{
  font-size:24px;
  font-weight:bold;
  color:#D4AF37;
  margin-bottom:15px;
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.info div{
  background:#06251B;
  padding:12px;
  border-radius:10px;
}

.description{
  margin-top:15px;
  line-height:1.6;
  color:#ddd;
}

.offer{
  background:#06251B;
  border:1px solid rgba(212,175,55,.25);
  border-radius:15px;
  padding:20px;
  margin-top:15px;
}

.offer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.master{
  font-size:19px;
  font-weight:bold;
}

.rating{
  color:#D4AF37;
  margin-top:5px;
}

.price{
  font-size:22px;
  font-weight:bold;
  color:#D4AF37;
}

.message{
  margin-top:12px;
  line-height:1.5;
  color:#ccc;
}

.time{
  margin-top:10px;
  color:#aaa;
}

button,
.btn{
  display:inline-block;
  margin-top:15px;
  padding:13px 20px;
  border:none;
  border-radius:10px;
  background:#D4AF37;
  color:#06251B;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

button:hover,
.btn:hover{
  opacity:.9;
}

.secondary{
  background:#123f30;
  color:#F4EBD0;
  border:1px solid #476b5b;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:#aaa;
}

.error{
  background:#351818;
  border:1px solid #8b2f2f;
  padding:20px;
  border-radius:12px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#123f30;
  color:#D4AF37;
  font-size:13px;
}

@media(max-width:700px){

  nav a:nth-child(1),
  nav a:nth-child(2){
    display:none;
  }

  .info{
    grid-template-columns:1fr;
  }

  .offer-header{
    flex-direction:column;
    align-items:flex-start;
  }

  .container{
    margin-top:25px;
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">KAG</a>

  <nav>
    <a href="marketplace.html">Кызматтар</a>
    <a href="cart.html">🛒 Корзина</a>
    <a href="orders.html">📦 Заказдар</a>
    <a href="profile.html">👤 Профиль</a>
  </nav>

</header>


<div class="container">

  <h1>Мастерлердин сунуштары</h1>

  <div id="content"></div>

</div>


<script>

const params =
  new URLSearchParams(window.location.search);

const taskId =
  params.get("task");

const content =
  document.getElementById("content");


/* =========================
   LOAD TASK
========================= */

const tasks =
  JSON.parse(
    localStorage.getItem("kagTasks") || "[]"
  );

const task =
  tasks.find(t => t.id === taskId);


/* =========================
   CHECK TASK
========================= */

if(!task){

  content.innerHTML = `

    <div class="card error">

      <h2>Тапшырма табылган жок</h2>

      <p style="margin-top:10px;">
        Тапшырма жок же шилтеме туура эмес.
      </p>

      <a
        href="task.html"
        class="btn"
      >
        Жаңы тапшырма түзүү
      </a>

    </div>

  `;

}else{

  renderTask();

}


/* =========================
   RENDER TASK
========================= */

function renderTask(){

  const offers =
    getOffers();


  content.innerHTML = `

    <div class="card">

      <div class="badge">
        ${task.status || "Жаңы"}
      </div>

      <div class="task-title" style="margin-top:12px;">
        ${escapeHtml(task.title)}
      </div>

      <div class="info">

        <div>
          📂 <strong>Категория:</strong><br>
          ${escapeHtml(task.category)}
        </div>

        <div>
          📍 <strong>Дарек:</strong><br>
          ${escapeHtml(task.address)}
        </div>

        <div>
          📅 <strong>Дата:</strong><br>
          ${escapeHtml(task.date)}
        </div>

        <div>
          💰 <strong>Бюджет:</strong><br>
          ${Number(task.budget || 0).toLocaleString()} сом
        </div>

      </div>

      <div class="description">

        <strong>Тапшырма:</strong><br>

        ${escapeHtml(task.description)}

      </div>

    </div>


    <div class="card">

      <h2 style="color:#D4AF37;">
        Сунуштар: ${offers.length}
      </h2>

      <div id="offersList">

        ${
          offers.length
          ? offers.map((offer,index) =>
              offerHtml(offer,index)
            ).join("")
          : `
            <div class="empty">

              <p>
                Азырынча мастерлерден сунуш жок.
              </p>

              <p style="margin-top:8px;">
                Бир аздан кийин кайра текшерип көрүңүз.
              </p>

            </div>
          `
        }

      </div>

    </div>

  `;

}


/* =========================
   GET OFFERS
========================= */

function getOffers(){

  /*
   * 1. Мастер dashboard аркылуу
   *    кошкон сунуштар.
   */

  const realOffers =
    Array.isArray(task.offers)
      ? task.offers
      : [];


  /*
   * 2. Эски demo сунуштарды
   *    биринчи жолу тапшырмада
   *    гана көрсөтөбүз.
   */

  const demoOffers = [

    {
      id:"DEMO-1001",
      master:"Азим Б.",
      rating:4.9,
      reviews:127,
      price:1500,
      time:"Бүгүн",
      message:
        "Тапшырманы аткара алам. Бүгүн келип көрүп, ишти сапаттуу бүтүрөм."
    },

    {
      id:"DEMO-1002",
      master:"Бекзат К.",
      rating:4.8,
      reviews:94,
      price:1300,
      time:"Эртең",
      message:
        "Бул иш боюнча тажрыйбам бар. Керектүү инструменттерим өзүмдө бар."
    },

    {
      id:"DEMO-1003",
      master:"Нурбек Т.",
      rating:5.0,
      reviews:63,
      price:1700,
      time:"Бүгүн кечинде",
      message:
        "Тез арада барып, тапшырманы аткарууга даярмын."
    }

  ];


  /*
   * Эгер мастер өзү сунуш жөнөткөн болсо,
   * ошол сунуштарды биринчи көрсөтөбүз.
   */

  if(realOffers.length){

    return realOffers;

  }


  return demoOffers;

}


/* =========================
   OFFER HTML
========================= */

function offerHtml(offer,index){

  return `

    <div class="offer">

      <div class="offer-header">

        <div>

          <div class="master">
            👤 ${escapeHtml(offer.master)}
          </div>

          <div class="rating">
            ⭐ ${offer.rating || "—"}
            ${
              offer.reviews
              ? ` · ${offer.reviews} пикир`
              : ""
            }
          </div>

        </div>

        <div class="price">

          ${Number(
            offer.price || 0
          ).toLocaleString()} сом

        </div>

      </div>


      <div class="message">

        ${escapeHtml(
          offer.message ||
          "Тапшырманы аткарууга даярмын."
        )}

      </div>


      ${
        offer.time
        ? `
          <div class="time">
            ⏰ ${escapeHtml(offer.time)}
          </div>
        `
        : ""
      }


      <button
        onclick="selectOffer(${index})"
      >
        ✓ Бул мастерди тандоо
      </button>

    </div>

  `;

}


/* =========================
   SELECT OFFER
========================= */

function selectOffer(index){

  const offers =
    getOffers();

  const offer =
    offers[index];


  if(!offer){

    alert("Сунуш табылган жок.");

    return;
  }


  const cartItem = {

    id:
      "CART-" +
      Date.now(),

    service:
      task.title,

    category:
      task.category,

    price:
      Number(offer.price || 0),

    quantity:
      1,

    address:
      task.address,

    date:
      task.date,

    note:
      task.description,

    master:
      offer.master,

    masterRating:
      offer.rating || null,

    taskId:
      task.id,

    offerId:
      offer.id

  };


  localStorage.setItem(
    "kagCart",
    JSON.stringify([cartItem])
  );


  /*
   * Тапшырманын статусун жаңыртабыз.
   */

  task.status =
    "Мастер тандалды";

  task.selectedMaster =
    offer.master;

  task.selectedOffer =
    offer.id;


  const taskIndex =
    tasks.findIndex(
      t => t.id === task.id
    );


  if(taskIndex !== -1){

    tasks[taskIndex] =
      task;

    localStorage.setItem(
      "kagTasks",
      JSON.stringify(tasks)
    );

  }


  /*
   * Checkout
   */

  window.location.href =
    "checkout.html";

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
